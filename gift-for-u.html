<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Gift For U 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --sky:        #AEE7FA;
  --sky-deep:   #8FD9F2;
  --pink:       #FF6FB0;
  --pink-deep:  #E8388B;
  --pink-shadow:#8A1B54;
  --cream:      #FFF8EE;
  --ink:        #2B2340;
  --pixel:      'Press Start 2P', monospace;
  --mono:       'VT323', monospace;
}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,var(--sky) 0%,var(--sky-deep) 100%);font-family:var(--mono);color:var(--ink)}
body{image-rendering:pixelated}

/* faint scanline / CRT texture */
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 2px, transparent 2px 4px);
  mix-blend-mode:overlay}

/* floating pixel stars */
.pxstar{position:absolute;width:6px;height:6px;background:#fff;opacity:.8;animation:pxTwinkle 2.4s ease-in-out infinite}
@keyframes pxTwinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}

.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vh 6vw;opacity:0;pointer-events:none;transition:opacity .5s ease}
.stage.active{opacity:1;pointer-events:all}

/* pixel-style button */
.pxbtn{font-family:var(--pixel);font-size:.7rem;color:#fff;background:var(--pink);border:none;padding:14px 22px;cursor:pointer;
  box-shadow:0 6px 0 var(--pink-shadow), 0 6px 0 var(--pink-shadow);
  image-rendering:pixelated;letter-spacing:.02em;transition:transform .08s, box-shadow .08s;}
.pxbtn:active{transform:translateY(6px);box-shadow:0 0 0 var(--pink-shadow)}
.pxbtn[disabled]{opacity:.4;pointer-events:none}

/* ═══════════ STAGE 1 ═══════════ */
.s1-cake{width:min(46vw,170px);margin-bottom:1.4rem;animation:cakeFloat 2.6s ease-in-out infinite}
.s1-cake img{width:100%;height:auto;display:block;image-rendering:pixelated;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
#stage-1 .title-line{font-family:var(--pixel);font-size:clamp(1.05rem,5.4vw,1.5rem);color:var(--pink-deep);text-align:center;line-height:1.9;text-shadow:2px 2px 0 rgba(255,255,255,.5);min-height:3.8em}
.type-cursor{display:inline-block;width:.55em;background:var(--pink-deep);animation:blinkCur .8s steps(1) infinite;margin-left:2px}
@keyframes blinkCur{50%{opacity:0}}
#stage-1 .pxbtn{margin-top:2.2rem;opacity:0;transition:opacity .4s ease}
#stage-1 .pxbtn.show{opacity:1}

/* ═══════════ STAGE 2: GIFT FOR U ═══════════ */
#stage-2 .gift-title{font-family:var(--pixel);font-size:clamp(1.3rem,7vw,2rem);color:var(--pink-deep);text-shadow:3px 3px 0 rgba(255,255,255,.55);letter-spacing:.03em;margin-bottom:2.2rem;text-align:center}
.cake-wrap{width:min(52vw,190px);animation:cakeFloat 2.6s ease-in-out infinite}
@keyframes cakeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.cake-wrap svg{width:100%;height:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
.loading-dot{width:9px;height:9px;border-radius:50%;background:var(--pink-deep);margin:1.6rem auto 0;animation:dotPulse 1.3s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
#stage-2 .pxbtn{margin-top:1.8rem}

/* ═══════════ STAGE 3: LOVE NOTE + SLIDESHOW ═══════════ */
#stage-3{padding-top:6vh;overflow-y:auto}
.note-wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px}

.slideshow{position:relative;width:min(78vw,260px);aspect-ratio:1/1.05;border:6px solid var(--cream);box-shadow:0 12px 26px rgba(30,10,40,.25);background:linear-gradient(135deg,#FFD8EA,#FFB6D9)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;display:flex;align-items:center;justify-content:center}
.slide.active{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide.ph-empty img{display:none}
.slide.ph-empty::after{content:'🖼  add photo';font-family:var(--mono);font-size:1.1rem;color:#B23E76;opacity:.7}
.slide-dots{display:flex;gap:8px;margin-top:12px}
.slide-dots span{width:8px;height:8px;background:rgba(232,56,139,.3);transition:background .2s}
.slide-dots span.active{background:var(--pink-deep)}

.note-card{margin-top:1.6rem;width:100%;background:var(--cream);border:4px solid #fff;box-shadow:0 4px 0 var(--pink-shadow), 0 14px 28px rgba(30,10,40,.2);padding:1.5rem 1.3rem;opacity:0;transform:translateY(14px);transition:opacity .5s ease, transform .5s ease}
.note-card.show{opacity:1;transform:none}
.note-card h2{font-family:var(--pixel);font-size:.85rem;color:var(--pink-deep);margin-bottom:.9rem;line-height:1.6}
.note-card p{font-family:var(--mono);font-size:1.25rem;line-height:1.55;color:var(--ink);margin-bottom:.5rem}
.note-sign{text-align:right;font-family:var(--mono);font-size:1.3rem;color:var(--pink-deep);margin-top:.4rem}
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     ██████████ CONFIGURATION ██████████
════════════════════════════════════════ -->
<script>
const C = {
  greetingText: "Happy Birthday, Koko",
  typeSpeedMs:  70,

  giftTitle: "Gift For U",

  /* Slideshow — 3 photos. Placeholders for now, add your own files later. */
  slidePhotos: ["images/templates/gift-for-u/memory1.jpg", "images/templates/gift-for-u/memory2.jpg", "images/templates/gift-for-u/memory3.jpg"],
  slideIntervalMs: 3000,

  noteTitle: "Dearest You,",
  noteLines: [
    "Happy birthday to the person who makes every ordinary day feel special.",
    "I hope this little gift made you smile, even just a bit \u2014 because you deserve all the softness in the world today.",
    "Here's to another year of you being exactly, wonderfully you."
  ],
  noteSign: "\u2014 with all my love"
};
</script>
<!-- ═══════════════════════════════════════ -->

<div class="scanlines"></div>
<div id="starLayer"></div>

<!-- ═══════════ STAGE 1: GREETING ═══════════ -->
<div class="stage active" id="stage-1">
  <div class="s1-cake"><img src="images/templates/gift-for-u/cake-pixel.png" alt="Birthday cake"/></div>
  <p class="title-line" id="typedGreeting"></p>
  <button class="pxbtn" id="nextBtn" onclick="goTo('stage-2')">Next</button>
</div>

<!-- ═══════════ STAGE 2: GIFT FOR U ═══════════ -->
<div class="stage" id="stage-2">
  <p class="gift-title" id="giftTitleEl"></p>
  <div class="cake-wrap">
    <svg viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="172" rx="62" ry="10" fill="rgba(30,10,40,.12)"/>
      <rect x="40" y="96" width="120" height="62" rx="10" fill="#CDEFF7"/>
      <path d="M40,110 C60,100 80,120 100,110 C120,100 140,120 160,110 L160,96 L40,96 Z" fill="#8B4B33"/>
      <path d="M40,120 C55,150 45,150 40,158 L46,158 C52,148 60,150 55,120 Z" fill="#8B4B33"/>
      <path d="M90,120 C100,150 90,150 85,158 L95,158 C102,148 108,150 103,120 Z" fill="#8B4B33"/>
      <path d="M140,120 C152,150 142,150 138,158 L146,158 C152,148 160,150 155,120 Z" fill="#8B4B33"/>
      <ellipse cx="100" cy="96" rx="60" ry="16" fill="#EAF9FC"/>
      <circle cx="60" cy="90" r="8" fill="#E23B5C"/>
      <circle cx="140" cy="90" r="8" fill="#E23B5C"/>
      <rect x="96" y="55" width="8" height="30" rx="3" fill="#FFD35C"/>
      <path d="M100,30 C106,40 106,48 100,54 C94,48 94,40 100,30 Z" fill="#FF8A3D"/>
      <path d="M100,36 C103,42 103,46 100,50 C97,46 97,42 100,36 Z" fill="#FFD35C"/>
    </svg>
  </div>
  <div class="loading-dot"></div>
  <button class="pxbtn" onclick="openGift()">Open It</button>
</div>

<!-- ═══════════ STAGE 3: LOVE NOTE + SLIDESHOW ═══════════ -->
<div class="stage" id="stage-3">
  <div class="note-wrap">
    <div class="slideshow" id="slideshow"></div>
    <div class="slide-dots" id="slideDots"></div>

    <div class="note-card" id="noteCard">
      <h2 id="noteTitleEl"></h2>
      <div id="noteBodyEl"></div>
      <p class="note-sign" id="noteSignEl"></p>
    </div>
  </div>
</div>

<script>
/* ══ scattered pixel stars ══ */
const starLayer = document.getElementById('starLayer');
for(let i=0;i<18;i++){
  const s = document.createElement('div');
  s.className = 'pxstar';
  s.style.left = Math.random()*100+'vw';
  s.style.top = Math.random()*100+'vh';
  s.style.animationDelay = (Math.random()*2.4)+'s';
  starLayer.appendChild(s);
}

/* ══ page nav ══ */
function goTo(id){
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ══ STAGE 1: typing animation ══ */
const typedEl = document.getElementById('typedGreeting');
const nextBtn = document.getElementById('nextBtn');
function typeGreeting(){
  let i = 0;
  typedEl.innerHTML = '<span class="type-cursor"></span>';
  const cursor = typedEl.querySelector('.type-cursor');
  function step(){
    if(i <= C.greetingText.length){
      typedEl.textContent = C.greetingText.slice(0,i);
      typedEl.appendChild(cursor);
      i++;
      setTimeout(step, C.typeSpeedMs);
    } else {
      cursor.remove();
      nextBtn.classList.add('show');
    }
  }
  step();
}
typeGreeting();

/* ══ STAGE 2 ══ */
document.getElementById('giftTitleEl').textContent = C.giftTitle;

function openGift(){
  goTo('stage-3');
  document.getElementById('noteCard').classList.add('show');
}

/* ══ STAGE 3: slideshow ══ */
const slideshow = document.getElementById('slideshow');
const slideDots = document.getElementById('slideDots');
C.slidePhotos.forEach((src,i)=>{
  const slide = document.createElement('div');
  slide.className = 'slide' + (i===0 ? ' active' : '');
  const img = document.createElement('img');
  img.alt = 'memory '+(i+1);
  img.src = src;
  img.onerror = function(){ slide.classList.add('ph-empty'); };
  slide.appendChild(img);
  slideshow.appendChild(slide);

  const dot = document.createElement('span');
  if(i===0) dot.classList.add('active');
  slideDots.appendChild(dot);
});

let currentSlide = 0;
function nextSlide(){
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.slide-dots span');
  slides[currentSlide].classList.remove('active');
  dots[currentSlide].classList.remove('active');
  currentSlide = (currentSlide + 1) % slides.length;
  slides[currentSlide].classList.add('active');
  dots[currentSlide].classList.add('active');
}
setInterval(nextSlide, C.slideIntervalMs);

/* ══ STAGE 3: note text ══ */
document.getElementById('noteTitleEl').textContent = C.noteTitle;
document.getElementById('noteBodyEl').innerHTML = C.noteLines.map(l=>`<p>${l}</p>`).join('');
document.getElementById('noteSignEl').textContent = C.noteSign;
</script>
</body>
</html>
