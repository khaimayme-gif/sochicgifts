<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Menu — So Chic Gifts</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Poppins:wght@200;300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --cream:#FBF5F0;
  --cream-deep:#F5EDE6;
  --blush:#F5B7D1;
  --blush-light:#FCEEF5;
  --rose-gold:#C08070;
  --rose-gold-dark:#9A5E50;
  --champagne:#D4AF37;
  --burgundy:#6B2030;
  --text:#2A1A18;
  --text-mid:#5A3A35;
  --text-muted:#8A6A65;
  --border:#EDD8D0;
  --white:#FFFBF8;
}

html{scroll-behavior:smooth}
body{
  background:var(--cream);color:var(--text);font-family:'Poppins',sans-serif;font-weight:300;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ===== NAV (matches index.html) ===== */
nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 52px;
  background:rgba(251,245,240,0.92);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(237,216,208,0.5);
}
@media(max-width:768px){nav{padding:16px 24px}}
.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.nav-logo-img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.nav-logo-text{font-family:'Playfair Display',serif;font-size:17px;font-style:italic;color:var(--rose-gold);letter-spacing:.04em}
.nav-back{font-size:10px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--text-mid);text-decoration:none;transition:color .25s ease}
.nav-back:hover{color:var(--rose-gold)}

/* ===== MENU HERO STRIP ===== */
.menu-select{padding:120px 24px 80px;text-align:center;flex:1}
.region-cards{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:48px}
.region-card{
  width:220px;padding:40px 24px;background:var(--white);
  border:1px solid var(--border);border-radius:20px;
  text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:16px;
  transition:transform .3s ease,box-shadow .3s ease;
}
.region-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(42,26,24,.12)}
.region-flag{width:56px;height:56px;border-radius:50%;object-fit:cover}
.region-name{font-family:'Playfair Display',serif;font-size:16px;color:var(--text)}
.menu-eyebrow{display:block;font-size:9px;font-weight:400;letter-spacing:.5em;text-transform:uppercase;color:var(--rose-gold);margin-bottom:14px}
.menu-title{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(26px,4vw,38px);color:var(--text);margin-bottom:8px}
.menu-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--text-muted)}

/* ===== FLIPBOOK STAGE ===== */
.flip-stage{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 16px 20px;gap:14px;
  flex:1;
  min-height:0;
}
#flipbook{
  box-shadow:0 24px 60px rgba(42,26,24,.14);
  border-radius:6px;
  overflow:hidden;
  background:var(--cream);
  height:100%;
  max-height:100%;
}
.page-img{width:100%;height:100%;object-fit:cover;background:var(--cream)}

/* controls */
.flip-controls{display:flex;align-items:center;gap:22px}
.flip-btn{
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--border);background:var(--white);
  color:var(--rose-gold);font-size:16px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .25s ease;
}
.flip-btn:hover{background:var(--rose-gold);color:#fff;border-color:var(--rose-gold);transform:translateY(-2px)}
.flip-btn:disabled{opacity:.35;cursor:default;transform:none}
.flip-count{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);min-width:70px;text-align:center}

.flip-download{
  margin-top:6px;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--rose-gold);text-decoration:none;border-bottom:1px solid transparent;
  transition:border-color .25s ease;
}
.flip-download:hover{border-color:var(--rose-gold)}

@media(max-width:600px){
  .menu-head{padding:120px 20px 20px}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="images/main/main-logo.png" alt="So Chic Gifts" class="nav-logo-img">
    <span class="nav-logo-text">So Chic Gifts</span>
  </a>
  <a href="index.html" class="nav-back">← Back Home</a>
</nav>

<div class="menu-select">
  <span class="menu-eyebrow">A Service Menu For Life's Meaningful Moments</span>
  <h1 class="menu-title">Choose Your Menu</h1>

  <div class="region-cards">
    <a href="menu-thailand.html" class="region-card">
      <img src="images/menu/flag-thailand.png" alt="" class="region-flag">
      <span class="region-name">Thailand Menu</span>
    </a>
    <a href="menu-japan.html" class="region-card">
      <img src="images/menu/flag-japan.png" alt="" class="region-flag">
      <span class="region-name">Japan Menu</span>
    </a>
    <a href="templates.html" class="region-card">
      <img src="images/menu/digital-menu.jpeg" alt="" class="region-flag">
      <span class="region-name">Digital Menu</span>
    </a>
  </div>
</div>

<script>
const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
  width: 380,
  height: 537,
  size: 'stretch',
  minWidth: 260,
  maxWidth: 620,
  minHeight: 367,
  maxHeight: 700,
  showCover: false,
  usePortrait: true,
  maxShadowOpacity: 0.4,
  flippingTime: 700,
  mobileScrollSupport: true
});

pageFlip.loadFromHTML(document.querySelectorAll('.page-img-wrap'));

const curPageEl = document.getElementById('curPage');
const totalPageEl = document.getElementById('totalPage');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

totalPageEl.textContent = pageFlip.getPageCount();

function updateControls(pageIndex){
  curPageEl.textContent = pageIndex + 1;
  prevBtn.disabled = pageIndex === 0;
  nextBtn.disabled = pageIndex === pageFlip.getPageCount() - 1;
}

pageFlip.on('flip', (e) => updateControls(e.data));
updateControls(0);

prevBtn.addEventListener('click', () => pageFlip.flipPrev());
nextBtn.addEventListener('click', () => pageFlip.flipNext());
</script>
</body>
</html>
