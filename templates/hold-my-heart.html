<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Hold This Heart 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{
  --pink:      #FF4D7E;
  --pink-deep: #E91E63;
  --pink-soft: #FFD3E1;
  --text:      #3D1626;
  --muted:     #B9788F;
  --white:     #FFFFFF;
  --body:      'Quicksand', system-ui, sans-serif;
  --script:    'Caveat', cursive;
  --es:        cubic-bezier(0.22,1,0.36,1);
}
html,body{height:100%;overflow:hidden;font-family:var(--body);color:var(--text);background:radial-gradient(circle at 50% 30%, #FFF6F9 0%, #FFE3EC 55%, #FFD0E0 100%)}

.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vh 6vw;opacity:0;pointer-events:none;transition:opacity .5s var(--es)}
.stage.active{opacity:1;pointer-events:all}

/* ═══════════ STAGE 1: HOLD THE HEART ═══════════ */
.hold-label{font-family:var(--body);font-weight:700;font-size:clamp(1.05rem,4.5vw,1.35rem);color:var(--pink-deep);text-align:center;line-height:1.45;margin-bottom:2.6rem}

.heart-hold-wrap{position:relative;width:min(58vw,230px);height:min(58vw,230px);cursor:pointer;touch-action:none}
.heart-hold-wrap.locked{cursor:default}
.heart-hold-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

.heart-fill-clip{clip-path:inset(calc(100% - var(--fill,0%)) 0 0 0);transition:clip-path .05s linear}
.heart-pulse{animation:heartPulse 1.15s ease-in-out infinite}
@keyframes heartPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.heart-hold-wrap.complete .heart-pulse{animation:heartBurst .55s var(--es)}
@keyframes heartBurst{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}

.spark{position:absolute;pointer-events:none;font-size:14px;color:var(--pink);opacity:0}
.spark.show{animation:sparkPop .7s ease-out forwards}
@keyframes sparkPop{0%{opacity:0;transform:translateY(0) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translateY(-38px) scale(1)}}

.hold-hint{margin-top:2.2rem;font-family:var(--body);font-weight:600;font-size:.85rem;color:var(--muted);letter-spacing:.03em}
.hold-hint.filling{color:var(--pink-deep)}
.progress-ring{margin-top:.9rem;width:120px;height:6px;border-radius:6px;background:rgba(233,30,99,.12);overflow:hidden}
.progress-ring-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--pink),var(--pink-deep));border-radius:6px;transition:width .05s linear}

/* ═══════════ STAGE 2: REVEAL ═══════════ */
#stage-reveal{justify-content:flex-start;padding-top:6vh;overflow-y:auto}
.reveal-inner{display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px}

.photo-card{background:#fff;border-radius:6px;padding:14px 14px 20px;box-shadow:0 20px 40px rgba(200,20,90,.22);transform:rotate(-2deg);width:min(76vw,270px)}
.photo-card .img-ph{width:100%;aspect-ratio:1/1.02;border-radius:2px;overflow:hidden;background:linear-gradient(135deg,#FFE1EC,#FFC3D9);display:flex;align-items:center;justify-content:center}
.photo-card .img-ph img{width:100%;height:100%;object-fit:cover;display:block}
.photo-card .img-ph.ph-empty img{display:none}
.photo-card .img-ph.ph-empty::after{content:'📷  add your photo';font-family:var(--body);font-weight:600;font-size:.72rem;color:#C2185B;opacity:.6}
.photo-caption{margin-top:12px;font-family:var(--body);font-weight:700;font-size:.85rem;color:var(--pink-deep);display:flex;align-items:center;gap:6px}
.photo-sub{margin-top:2px;font-family:var(--body);font-size:.72rem;color:var(--muted)}

.note-card{margin-top:1.6rem;width:min(84vw,320px);background:
    repeating-linear-gradient(#FFFDFB 0 30px, rgba(233,30,99,.08) 31px);
  background-color:#FFFDFB;
  border-radius:10px;padding:1.6rem 1.4rem;box-shadow:0 16px 34px rgba(200,20,90,.18);min-height:140px}
.note-card p{font-family:var(--script);font-size:1.35rem;line-height:1.6;color:var(--text);white-space:pre-wrap}
.note-card .cursor{display:inline-block;width:2px;background:var(--pink-deep);margin-left:1px;animation:blinkCursor .8s steps(1) infinite;height:1.1em;vertical-align:text-bottom}
@keyframes blinkCursor{50%{opacity:0}}

.music-pill{margin-top:1.6rem;display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:7px 16px 7px 7px;box-shadow:0 10px 22px rgba(200,20,90,.18)}
.music-btn{width:32px;height:32px;border-radius:50%;background:var(--pink-deep);border:none;color:#fff;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.music-info{display:flex;flex-direction:column;overflow:hidden;max-width:170px}
.music-title{font-family:var(--body);font-weight:700;font-size:.72rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:flex;align-items:flex-end;gap:2px;height:11px;margin-top:2px}
.eq span{width:2px;background:var(--pink-deep);border-radius:1px;animation:eqAnim 1s ease-in-out infinite}
.eq span:nth-child(1){height:40%}
.eq span:nth-child(2){height:100%;animation-delay:.2s}
.eq span:nth-child(3){height:60%;animation-delay:.4s}
.eq.paused span{animation-play-state:paused;height:30%!important}
@keyframes eqAnim{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     ██████████ CONFIGURATION ██████████
════════════════════════════════════════ -->
<script>
const C = {
  holdLabel:   "Hold onto this heart\nfor a little while",
  holdHint:    "press and hold...",
  holdMs:      2200,   // how long they need to hold to fill the heart fully

  photo:       "images/templates/hold-my-heart/memory1.jpg",     // placeholder — swap this file in later
  photoCaption:"Happy Anniversary 🩷",
  photoSub:    "the moment I fell for you all over again",

  noteLines: [
    "My love,",
    "",
    "Every second with you feels like a gift I didn't know I needed.",
    "Thank you for filling my life with warmth, laughter, and a love",
    "that only keeps growing.",
    "",
    "Happy anniversary — here's to us, always.",
    "",
    "— always yours 🤍"
  ],
  typeSpeedMs: 32,      // ms per character for the typing animation

  musicSrc:    "audio/perfect.mp3",    // placeholder — swap this file in later
  musicTitle:  "our song"
};
</script>
<!-- ═══════════════════════════════════════ -->

<!-- ═══════════ STAGE 1: HOLD THE HEART ═══════════ -->
<div class="stage active" id="stage-hold">
  <p class="hold-label" id="holdLabelEl"></p>

  <div class="heart-hold-wrap" id="heartHoldWrap">
    <svg viewBox="0 0 200 180" class="heart-pulse">
      <!-- outline (empty) heart -->
      <path d="M100,170 C25,120 0,80 0,50 C0,18 24,0 52,0 C74,0 92,12 100,30 C108,12 126,0 148,0 C176,0 200,18 200,50 C200,80 175,120 100,170 Z"
            fill="none" stroke="#FF9FBB" stroke-width="6"/>
      <!-- filled heart, revealed bottom-up via clip-path as they hold -->
      <g class="heart-fill-clip" id="heartFillClip" style="--fill:0%">
        <path d="M100,170 C25,120 0,80 0,50 C0,18 24,0 52,0 C74,0 92,12 100,30 C108,12 126,0 148,0 C176,0 200,18 200,50 C200,80 175,120 100,170 Z"
              fill="url(#heartGradFill)"/>
      </g>
      <defs>
        <linearGradient id="heartGradFill" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#E91E63"/>
          <stop offset="100%" stop-color="#FF6F9C"/>
        </linearGradient>
      </defs>
    </svg>
    <div id="sparkLayer"></div>
  </div>

  <p class="hold-hint" id="holdHintEl"></p>
  <div class="progress-ring"><div class="progress-ring-fill" id="progressFill"></div></div>
</div>

<!-- ═══════════ STAGE 2: REVEAL ═══════════ -->
<div class="stage" id="stage-reveal">
  <div class="reveal-inner">
    <div class="photo-card">
      <div class="img-ph" id="photoBox"><img id="photoImg" alt="Us"/></div>
      <p class="photo-caption" id="photoCaptionEl">🩷 <span></span></p>
      <p class="photo-sub" id="photoSubEl"></p>
    </div>

    <div class="note-card">
      <p id="noteTyped"></p>
    </div>

    <div class="music-pill">
      <button class="music-btn" id="musicBtn">▶</button>
      <div class="music-info">
        <span class="music-title" id="musicTitleEl"></span>
        <div class="eq paused" id="eq"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>
</div>

<audio id="bgm" loop preload="auto"></audio>

<script>
/* ══ populate config-driven text ══ */
document.getElementById('holdLabelEl').innerHTML = C.holdLabel.replace(/\n/g,'<br/>');
document.getElementById('holdHintEl').textContent = C.holdHint;
document.getElementById('photoCaptionEl').querySelector('span').textContent = C.photoCaption;
document.getElementById('photoSubEl').textContent = C.photoSub;
document.getElementById('musicTitleEl').textContent = C.musicTitle;

const photoImg = document.getElementById('photoImg');
photoImg.src = C.photo;
photoImg.onerror = function(){ this.closest('.img-ph').classList.add('ph-empty'); };

document.getElementById('bgm').src = C.musicSrc;

/* ══ HOLD-TO-FILL HEART ══ */
const wrap        = document.getElementById('heartHoldWrap');
const fillClip     = document.getElementById('heartFillClip');
const progressFill = document.getElementById('progressFill');
const holdHintEl   = document.getElementById('holdHintEl');
const sparkLayer   = document.getElementById('sparkLayer');

let holding = false;
let fillPct = 0;          // 0-100
let rafId = null;
let lastTs = null;
let completed = false;

function setFill(pct){
  fillPct = Math.max(0, Math.min(100, pct));
  fillClip.style.setProperty('--fill', fillPct + '%');
  progressFill.style.width = fillPct + '%';
}

function spawnSpark(){
  const s = document.createElement('div');
  s.className = 'spark show';
  s.textContent = ['✨','💗','♡'][Math.floor(Math.random()*3)];
  s.style.left = (30 + Math.random()*40) + '%';
  s.style.top  = (55 + Math.random()*20) + '%';
  sparkLayer.appendChild(s);
  setTimeout(()=> s.remove(), 750);
}

function loop(ts){
  if(lastTs === null) lastTs = ts;
  const dt = ts - lastTs;
  lastTs = ts;

  if(completed){ rafId = null; return; }

  if(holding){
    setFill(fillPct + (dt / C.holdMs) * 100);
    if(Math.random() < 0.06) spawnSpark();
    if(fillPct >= 100){
      completed = true;
      wrap.classList.add('complete');
      holdHintEl.textContent = 'thank you 🤍';
      setTimeout(revealNote, 650);
      return;
    }
  } else {
    // drain back down slowly if released before completion
    setFill(fillPct - (dt / (C.holdMs*0.6)) * 100);
  }
  rafId = requestAnimationFrame(loop);
}

function startHold(e){
  if(completed) return;
  e.preventDefault();
  holding = true;
  holdHintEl.classList.add('filling');
  holdHintEl.textContent = 'keep holding...';
  lastTs = null;
  if(!rafId) rafId = requestAnimationFrame(loop);
}
function endHold(){
  if(completed) return;
  holding = false;
  holdHintEl.classList.remove('filling');
  holdHintEl.textContent = C.holdHint;
}

wrap.addEventListener('pointerdown', startHold);
wrap.addEventListener('pointerup', endHold);
wrap.addEventListener('pointerleave', endHold);
wrap.addEventListener('pointercancel', endHold);

/* ══ REVEAL: photo + note + music ══ */
function revealNote(){
  document.getElementById('stage-hold').classList.remove('active');
  document.getElementById('stage-reveal').classList.add('active');
  typeNote();
  tryPlayMusic();
}

function typeNote(){
  const el = document.getElementById('noteTyped');
  const fullText = C.noteLines.join('\n');
  el.innerHTML = '<span class="cursor"></span>';
  let i = 0;
  const cursor = el.querySelector('.cursor');

  function step(){
    if(i <= fullText.length){
      el.textContent = fullText.slice(0, i);
      el.appendChild(cursor);
      i++;
      setTimeout(step, C.typeSpeedMs);
    } else {
      cursor.remove();
    }
  }
  step();
}

function tryPlayMusic(){
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('musicBtn');
  const eq  = document.getElementById('eq');
  bgm.play().then(()=>{
    btn.textContent = '❚❚';
    eq.classList.remove('paused');
  }).catch(()=>{
    btn.textContent = '▶';
    eq.classList.add('paused');
  });
}

document.getElementById('musicBtn').addEventListener('click', ()=>{
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('musicBtn');
  const eq  = document.getElementById('eq');
  if(bgm.paused){
    bgm.play().then(()=>{ btn.textContent='❚❚'; eq.classList.remove('paused'); }).catch(()=>{});
  } else {
    bgm.pause();
    btn.textContent = '▶';
    eq.classList.add('paused');
  }
});
</script>
</body>
</html>
