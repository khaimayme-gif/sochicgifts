<!DOCTYPE html>
<!--
  BIRTHDAY GIFT SITE — customization guide

  1. Background Image: place your pixel landscape image in ../images/templates/our-little-secret/background.jpeg (or change the URL in the .sky CSS rule).
  2. Pincode: change PIN_CODE near the top of the <script> section (currently "5201").
  3. Giftbox images: replace ../images/templates/our-little-secret/giftbox.png with your own pictures if desired.
  4. Memory photos: replace ../images/templates/our-little-secret/memory1.jpeg, memory2.jpeg, memory3.jpeg.
  5. Letter wish text: edit the LETTER_TEXT constant in the <script> section.
  6. Song: replace the video ID in the iframe src (screen-song section) with your own YouTube video ID.
  7. Floating Player: Positioned at top-right, works continuously across all screens.
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给你的礼物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  image-rendering: pixelated;
}

:root {
  --purple-deep: #6b5b9a;
  --purple-mid: #8b7bb8;
  --pink-hot: #ff6fa5;
  --pink-soft: #ffb8d9;
  --pink-pale: #ffd9e8;
  --peach: #ffb894;
  --cream: #fff5e8;
  --ink: #4a3b6b;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Press Start 2P', 'ZCOOL KuaiLe', monospace;
  background: #1a1330;
}

/* ---------- FLOATING TOP-RIGHT AUDIO BUTTON ---------- */
.floating-audio-control {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 8px;
}

.floating-audio-btn {
  width: 44px;
  height: 44px;
  background: linear-gradient(180deg, var(--pink-hot), #e0508a);
  border: 3px solid #fff;
  border-radius: 50%;
  color: #fff;
  font-family: 'Press Start 2P', 'ZCOOL KuaiLe', monospace;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3), 0 0 0 2px var(--purple-deep);
  transition: transform 0.1s, background-color 0.2s;
}

.floating-audio-btn:hover {
  transform: scale(1.08);
}

.floating-audio-btn:active {
  transform: scale(0.95);
}

/* ---------- FULLSCREEN BACKGROUND IMAGE ---------- */
.sky {
  position: fixed;
  inset: 0;
  background: url('../images/templates/our-little-secret/background.jpeg') no-repeat center center / cover;
  z-index: 0;
}

.screen {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: none;
  align-items: center;
  justify-content: center;
}

.screen.active {
  display: flex;
}

/* ---------- SCREEN 1: INTRO ---------- */
#screen-intro {
  flex-direction: row;
  gap: 40px;
  padding: 0 8vw;
}

.character {
  position: relative;
  z-index: 2;
  animation: bob 2.4s ease-in-out infinite;
}

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.speech-bubble {
  position: relative;
  background: #fff;
  border: 5px solid var(--pink-soft);
  border-radius: 18px;
  padding: 28px 34px;
  max-width: 360px;
  z-index: 2;
}

.speech-bubble::before {
  content: "";
  position: absolute;
  left: -22px;
  bottom: 30px;
  width: 0;
  height: 0;
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
  border-right: 22px solid var(--pink-soft);
}

.speech-bubble p {
  color: var(--pink-hot);
  font-size: 20px;
  line-height: 1.6;
  text-align: center;
}

/* ---------- SCREEN 2: PINCODE ---------- */
#screen-pincode {
  flex-direction: row;
}

.pincode-left {
  flex: 1;
  height: 100%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.character-pair {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: flex-end;
}

.pincode-right {
  flex: 1;
  height: 100%;
  background: rgba(255, 217, 232, 0.85);
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 26px;
  padding: 20px;
}

.pin-title {
  color: #8a5a7a;
  font-size: 22px;
  text-align: center;
  line-height: 1.6;
}

.pin-dots {
  display: flex;
  gap: 14px;
}

.pin-dot {
  width: 44px;
  height: 44px;
  border: 4px solid var(--pink-hot);
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: var(--pink-hot);
  border-radius: 6px;
}

.pin-dot.filled::before {
  content: "★";
}

.pin-error {
  color: #d63868;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.2s;
  text-align: center;
}
.pin-error.show {
  opacity: 1;
  animation: shake 0.35s;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 70px);
  grid-gap: 12px;
}

.key {
  width: 70px;
  height: 70px;
  border: none;
  cursor: pointer;
  background: linear-gradient(180deg, var(--pink-hot), #e0508a);
  clip-path: polygon(50% 0%, 90% 20%, 100% 60%, 70% 100%, 30% 100%, 0% 60%, 10% 20%);
  color: #fff;
  font-family: 'Press Start 2P', 'ZCOOL KuaiLe', monospace;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s;
}

.key:active {
  transform: scale(0.9);
}

.key-clear, .key-back {
  background: linear-gradient(180deg, #ffc3dc, #ffa9cb);
  font-size: 20px;
}

/* ---------- SCREEN 3: HAPPY BIRTHDAY LOVE ---------- */
#screen-welcome {
  flex-direction: row;
  gap: 60px;
  padding: 0 8vw;
}

.hearts-row {
  position: absolute;
  top: 6%;
  left: 6%;
  display: flex;
  gap: 10px;
  font-size: 26px;
  color: var(--pink-hot);
}

.welcome-card {
  position: relative;
  background: rgba(180, 90, 140, 0.65);
  backdrop-filter: blur(4px);
  border-radius: 24px;
  padding: 40px 34px;
  display: flex;
  align-items: flex-end;
  gap: -10px;
  z-index: 2;
}

.welcome-card .character-pair {
  animation: bob 2.4s ease-in-out infinite;
}

.floating-heart {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
  color: #ffdce9;
  animation: floatHeart 2s ease-in-out infinite;
}

@keyframes floatHeart {
  0%, 100% { transform: translate(-50%, 0); }
  50% { transform: translate(-50%, -10px); }
}

.welcome-title {
  color: var(--pink-hot);
  font-size: 34px;
  text-align: center;
  line-height: 1.6;
  text-shadow: 3px 3px 0 var(--purple-deep);
  z-index: 2;
}

.start-btn {
  margin-top: 24px;
  background: linear-gradient(180deg, #a78bd9, #7b5fc7);
  border: 4px solid #5b3fa0;
  color: #fff;
  font-family: 'Press Start 2P', 'ZCOOL KuaiLe', monospace;
  font-size: 18px;
  padding: 14px 36px;
  cursor: pointer;
  box-shadow: 0 6px 0 #4a2f85;
  transition: transform 0.1s, box-shadow 0.1s;
}

.start-btn:active {
  transform: translateY(6px);
  box-shadow: 0 0 0 #4a2f85;
}

.welcome-col {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ---------- SCREEN 4: CHATHEAD ---------- */
#screen-chathead {
  flex-direction: row;
  gap: 40px;
  padding: 0 8vw;
  cursor: pointer;
}

.next-arrow {
  position: absolute;
  top: 6%;
  right: 80px;
  width: 0;
  height: 0;
  border-top: 16px solid transparent;
  border-bottom: 16px solid transparent;
  border-left: 26px solid var(--pink-hot);
  filter: drop-shadow(2px 2px 0 var(--purple-deep));
  animation: pulseArrow 1.2s ease-in-out infinite;
}

@keyframes pulseArrow {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(6px); }
}

/* ---------- SCREEN 5: GIFT SELECTION ---------- */
#screen-gifts {
  flex-direction: column;
  gap: 60px;
}

.gifts-title {
  color: var(--pink-hot);
  font-size: 32px;
  text-align: center;
  line-height: 1.6;
  text-shadow: 3px 3px 0 var(--purple-deep);
  z-index: 2;
}

.gift-row {
  display: flex;
  gap: 60px;
  z-index: 2;
}

.giftbox {
  width: 130px;
  cursor: pointer;
  animation: giftBob 1.8s ease-in-out infinite;
  transition: transform 0.15s;
}

.giftbox:nth-child(2) { animation-delay: 0.2s; }
.giftbox:nth-child(3) { animation-delay: 0.4s; }

.giftbox:hover {
  transform: scale(1.08);
}

@keyframes giftBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.giftbox img {
  width: 100%;
  height: auto;
  display: block;
}

.gift-label {
  text-align: center;
  color: #fff;
  font-size: 20px;
  margin-top: 14px;
  text-shadow: 2px 2px 0 var(--purple-deep);
}

/* ---------- SCREEN 6: ENVELOPE OPENING ---------- */
#screen-envelope {
  background: rgba(255, 95, 150, 0.85);
  backdrop-filter: blur(4px);
  overflow: hidden;
}

.envelope-stage {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.flap-bottom-left,
.flap-bottom-right {
  position: absolute;
  bottom: 0;
  width: 55%;
  height: 60%;
  background: #e0447f;
  opacity: 0;
  transition: opacity 0.4s ease 0.9s;
}
.flap-bottom-left {
  left: 0;
  clip-path: polygon(0 100%, 0 0, 100% 100%);
}
.flap-bottom-right {
  right: 0;
  clip-path: polygon(100% 100%, 100% 0, 0 100%);
}
#screen-envelope.opened .flap-bottom-left,
#screen-envelope.opened .flap-bottom-right {
  opacity: 1;
}

.heart-seal {
  position: relative;
  width: 220px;
  height: 200px;
  z-index: 5;
  transition: transform 1s cubic-bezier(.4,1.6,.5,1), top 1s cubic-bezier(.4,1.6,.5,1);
}
.heart-seal::before,
.heart-seal::after {
  content: "";
  position: absolute;
  top: 0;
  width: 110px;
  height: 170px;
  background: #b53564;
  border-radius: 60px 60px 0 0;
}
.heart-seal::before { left: 110px; transform: rotate(-45deg); transform-origin: 0 100%; }
.heart-seal::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }

#screen-envelope.opened .heart-seal {
  transform: scale(0.4) translateY(-190px);
}

.letter-card {
  position: absolute;
  width: 78%;
  max-width: 420px;
  height: 62%;
  background: #d9c6a3;
  border: 6px solid #a98a5e;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 4;
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.6s ease 1s, transform 0.6s ease 1s;
  cursor: pointer;
}

#screen-envelope.opened .letter-card {
  opacity: 1;
  transform: translateY(0);
}

.letter-card p {
  color: #4a3324;
  font-size: 22px;
  text-align: center;
  line-height: 1.8;
}

/* ---------- SCREEN 7: LETTER CONTENT ---------- */
#screen-letter {
  padding: 6vh 8vw;
}

.letter-page {
  background: #d9c6a3;
  border: 6px solid #a98a5e;
  max-width: 640px;
  width: 100%;
  padding: 40px 36px;
  position: relative;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.letter-page p {
  color: #4a3324;
  font-size: 15px;
  line-height: 2;
  text-align: left;
}

.back-link {
  position: absolute;
  top: 6%;
  left: 6%;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  text-shadow: 2px 2px 0 var(--purple-deep);
  z-index: 3;
}

/* ---------- SCREEN 8: PHOTO MEMORIES ---------- */
#screen-photos {
  flex-direction: column;
  gap: 40px;
}

.photos-title {
  color: var(--pink-hot);
  font-size: 26px;
  text-align: center;
  text-shadow: 3px 3px 0 var(--purple-deep);
  z-index: 2;
}

.photos-row {
  display: flex;
  gap: 26px;
  z-index: 2;
  flex-wrap: wrap;
  justify-content: center;
  padding: 0 6vw;
}

.photo-window {
  width: 220px;
  background: #fff;
  border: 4px solid var(--ink);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
}

.photo-window .window-bar {
  background: var(--pink-soft);
  border-bottom: 4px solid var(--ink);
  padding: 5px 8px;
  display: flex;
  gap: 5px;
}

.photo-window .window-bar span {
  width: 10px;
  height: 10px;
  background: var(--ink);
  border-radius: 50%;
  display: inline-block;
}

.photo-window img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
}

/* ---------- SCREEN 9: SONG FOR YOU ---------- */
.song-title {
  color: var(--pink-hot);
  font-size: 40px;
  text-align: center;
  text-shadow: 3px 3px 0 var(--purple-deep);
  line-height: 1.3;
  z-index: 2;
}

#screen-song {
  flex-direction: row;
  gap: 40px;
  padding: 0 6vw;
  align-items: center;
  justify-content: center;
}

.song-left {
  flex: 0 0 620px;
  display: flex;
  justify-content: center;
}

.song-right {
  flex: 0 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.pixel-pig-img {
  width: 100px;
  height: auto;
}

.player-window {
  width: 92%;
  max-width: 620px;
  background: #cdb8e8;
  border: 5px solid #6b4f9e;
  z-index: 2;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.player-titlebar {
  background: #a78bd9;
  border-bottom: 4px solid #6b4f9e;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #3a2a5e;
  font-size: 11px;
}

.player-titlebar .dots span {
  display: inline-block;
  width: 9px;
  height: 9px;
  background: #3a2a5e;
  margin-left: 5px;
}

.video-wrap {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  background: #000;
  border-bottom: 4px solid #6b4f9e;
}

.video-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.player-controls {
  padding: 16px 18px 20px;
}

.progress-bar {
  height: 6px;
  background: #8f72c2;
  border-radius: 3px;
  margin-bottom: 16px;
  position: relative;
}

.progress-bar::before {
  content: "";
  position: absolute;
  left: 0;
  top: -4px;
  width: 14px;
  height: 14px;
  background: #fff;
  border-radius: 50%;
  border: 3px solid #6b4f9e;
}

.player-buttons {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
}

.player-buttons button {
  background: none;
  border: none;
  cursor: pointer;
  color: #3a2a5e;
  font-size: 18px;
}

.player-buttons .play-pause {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #6b4f9e;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

/* Responsive */
@media (max-width: 700px) {
  #screen-intro, #screen-pincode, #screen-welcome, #screen-chathead, #screen-song {
    flex-direction: column;
    gap: 20px;
  }
  .pincode-left {
    width: 100%;
    height: 32%;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .character-pair {
    width: 100%;
    justify-content: center;
  }
  .pincode-right {
    width: 100%;
    height: 68%;
    flex: 1;
    gap: 14px;
    overflow-y: auto;
  }
  .couple-img {
    max-height: 85%;
    width: auto;
    max-width: 150%;
  }
  .keypad { grid-template-columns: repeat(3, 54px); grid-gap: 8px; }
  .key { width: 54px; height: 54px; font-size: 14px; }
  .speech-bubble { max-width: 80vw; }
  .welcome-title { white-space: pre-line; font-size: 24px; }
  .gift-row { gap: 24px; flex-wrap: wrap; justify-content: center; }
  .gifts-title { font-size: 22px; }
  .giftbox { width: 90px; }
  .letter-page p { font-size: 13px; }
  .letter-card p { font-size: 16px; }
  .heart-seal { width: 150px; height: 130px; }
  .photo-window { width: 42vw; }
  .photo-window img { height: 42vw; }
  .photos-title { font-size: 18px; }
  .song-title { font-size: 22px; line-height: 1.4; }
  #screen-song { padding: 16px 6vw; overflow-y: auto; }
  .song-left { flex-basis: auto; width: 100%; }
  .song-right { gap: 12px; }
  .pixel-pig-img { width: 90px; }
  .player-window { width: 100%; }
  .floating-audio-control { top: 10px; right: 10px; }
  .floating-audio-btn { width: 38px; height: 38px; font-size: 14px; }
}
</style>
</head>
<body>

<!-- FLOATING TOP-RIGHT AUDIO BUTTON -->
<div class="floating-audio-control">
  <button id="global-bgm-btn" class="floating-audio-btn" aria-label="Toggle music">▶</button>
</div>

<!-- Background Audio -->
<audio id="bgm-audio" loop preload="auto">
  <source src="../audio/bgm.mp3" type="audio/mpeg">
  <source src="audio/bgm.ogg" type="audio/ogg">
</audio>

<!-- FULLSCREEN BACKGROUND IMAGE -->
<div class="sky"></div>

<!-- SCREEN 1: Intro -->
<section id="screen-intro" class="screen active">
  <div class="character">
    <img class="pixel-girl-img" src="../images/templates/our-little-secret/pixel-girl.png" alt="">
  </div>
  <div class="speech-bubble">
    <p id="intro-text">祝你生日快乐！！！</p>
  </div>
</section>

<!-- SCREEN 2: Pincode -->
<section id="screen-pincode" class="screen">
  <div class="pincode-left">
    <div class="character-pair">
      <img class="couple-img" src="../images/templates/our-little-secret/pixel-couple.png" alt="">
    </div>
  </div>
  <div class="pincode-right">
    <h1 class="pin-title">请输入密码</h1>
    <div class="pin-dots">
      <div class="pin-dot" data-index="0"></div>
      <div class="pin-dot" data-index="1"></div>
      <div class="pin-dot" data-index="2"></div>
      <div class="pin-dot" data-index="3"></div>
    </div>
    <div class="pin-error" id="pin-error">密码错误，请重新输入！</div>
    <div class="keypad">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key key-clear" data-key="clear">*</button>
      <button class="key" data-key="0">0</button>
      <button class="key key-back" data-key="back">#</button>
    </div>
  </div>
</section>

<!-- SCREEN 3: Happy Birthday Love -->
<section id="screen-welcome" class="screen">
  <div class="hearts-row">
    <span>♥</span><span>♥</span><span>♥</span>
  </div>
  <div class="welcome-col">
    <div class="welcome-card">
      <div class="floating-heart">♥</div>
      <div class="character-pair">
        <img class="couple-img" src="../images/templates/our-little-secret/pixel-couple.png" alt="">
      </div>
    </div>
  </div>
  <div class="welcome-col">
    <h1 class="welcome-title" id="welcome-title-text"> 祝你生日快乐 ！<br> 哥💕</h1>
    <button class="start-btn" id="start-btn">开始</button>
  </div>
</section>

<!-- SCREEN 4: Chathead -->
<section id="screen-chathead" class="screen">
  <div class="next-arrow"></div>
  <div class="character">
    <img class="pixel-girl-img" src="../images/templates/our-little-secret/pixel-girl.png" alt="">
  </div>
  <div class="speech-bubble">
    <p id="chathead-text">宝贝，这份礼物 <br> 是我特意为你准备的 <br> ♡</p>
  </div>
</section>

<!-- SCREEN 5: Gift Selection -->
<section id="screen-gifts" class="screen">
  <h1 class="gifts-title">选择你的礼物</h1>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/BcqxLCWn-CE?si=RY8tJ4vHff0fFQYo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  </div>
</section>

<!-- YouTube iFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
// ---------- CONFIG ----------
const PIN_CODE = "5201";

// ---------- BACKGROUND AUDIO & FLOATING BUTTON LOGIC ----------
const bgm = document.getElementById('bgm-audio');
const globalBgmBtn = document.getElementById('global-bgm-btn');
bgm.volume = 0.2;

function updateBgmButtonState() {
  if (bgm.paused) {
    globalBgmBtn.textContent = '▶';
  } else {
    globalBgmBtn.textContent = '❚❚';
  }
}

function playBGM() {
  if (bgm.paused) {
    bgm.play().then(() => {
      updateBgmButtonState();
    }).catch(() => {
      // Browsers block autoplay without prior interaction
    });
  }
}

function pauseBGM() {
  bgm.pause();
  updateBgmButtonState();
}

function toggleBGM() {
  if (bgm.paused) {
    playBGM();
  } else {
    pauseBGM();
  }
}

// Click listener for the floating top-right button
globalBgmBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleBGM();
});

// Start BGM on first screen click interaction if paused
window.addEventListener('click', () => {
  if (bgm.paused && !songPlaying) {
    playBGM();
  }
}, { once: true });

// ---------- YOUTUBE API INTEGRATION ----------
let player;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt-player', {
    events: {
      'onStateChange': onPlayerStateChange
    }
  });
}

function onPlayerStateChange(event) {
  // YT.PlayerState.PLAYING === 1
  if (event.data === 1) {
    pauseBGM();
    songPlaying = true;
    playPauseBtn.textContent = '⏸';
  } else if (event.data === 2 || event.data === 0) {
    // YT.PlayerState.PAUSED === 2, YT.PlayerState.ENDED === 0
    songPlaying = false;
    playPauseBtn.textContent = '▶';
  }
}

// ---------- SCREEN NAVIGATION ----------
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Click anywhere on intro screen to move to pincode
document.getElementById('screen-intro').addEventListener('click', () => {
  showScreen('screen-pincode');
});

typeText(document.getElementById('intro-text'), "祝你生日快乐！！！", 45);

function typeText(el, text, speed = 35) {
  el.textContent = "";
  let i = 0;
  function step() {
    if (i < text.length) {
      el.textContent += text.charAt(i);
      i++;
      setTimeout(step, speed);
    }
  }
  step();
}

// ---------- PINCODE LOGIC ----------
let enteredPin = "";
const pinDots = document.querySelectorAll('.pin-dot');
const pinError = document.getElementById('pin-error');

function updateDots() {
  pinDots.forEach((dot, i) => {
    dot.classList.toggle('filled', i < enteredPin.length);
  });
}

function resetPin() {
  enteredPin = "";
  updateDots();
}

function checkPin() {
  if (enteredPin === PIN_CODE) {
    pinError.classList.remove('show');
    setTimeout(() => {
      showScreen('screen-welcome');
      resetPin();
    }, 200);
  } else {
    pinError.classList.add('show');
    setTimeout(() => {
      resetPin();
      pinError.classList.remove('show');
    }, 600);
  }
}

document.querySelectorAll('.key').forEach(key => {
  key.addEventListener('click', () => {
    const value = key.dataset.key;

    if (value === 'clear') {
      resetPin();
      return;
    }
    if (value === 'back') {
      enteredPin = enteredPin.slice(0, -1);
      updateDots();
      return;
    }
    if (enteredPin.length < 4) {
      enteredPin += value;
      updateDots();
    }
    if (enteredPin.length === 4) {
      checkPin();
    }
  });
});

// ---------- START BUTTON ----------
document.getElementById('start-btn').addEventListener('click', () => {
  showScreen('screen-chathead');
  typeText(document.getElementById('chathead-text'), `宝贝，
这份礼物
是我特意为你准备的
♡`, 45);
});

// ---------- CHATHEAD ----------
document.getElementById('screen-chathead').addEventListener('click', () => {
  showScreen('screen-gifts');
});

// ---------- GIFT SELECTION ----------
document.querySelectorAll('.giftbox').forEach(box => {
  box.addEventListener('click', () => {
    const gift = box.dataset.gift;
    if (gift === 'letter') {
      openEnvelope();
    } else if (gift === 'photos') {
      showScreen('screen-photos');
    } else if (gift === 'song') {
      showScreen('screen-song');
    }
  });
});

// ---------- ENVELOPE OPENING ANIMATION ----------
const envelopeScreen = document.getElementById('screen-envelope');
const letterCard = document.getElementById('letter-card');

function openEnvelope() {
  envelopeScreen.classList.remove('opened');
  showScreen('screen-envelope');
  setTimeout(() => {
    envelopeScreen.classList.add('opened');
    setTimeout(() => {
      typeText(document.getElementById('letter-card-text'), "写给你的信", 60);
    }, 1000);
  }, 500);
}

// clicking the revealed "写给你的信" card moves to the full letter
letterCard.addEventListener('click', () => {
  if (envelopeScreen.classList.contains('opened')) {
    showLetter();
  }
});

// ---------- LETTER CONTENT ----------
const LETTER_TEXT = "生日快乐，我的男朋友🎂❤️<br><br>新的一岁，希望你平平安安，健健康康，每天都能开开心心，想做的事情都能顺顺利利。<br><br>我知道自己有时候没有给你足够的时间，也可能没有很好地陪着你。虽然我不是一个很会表达感情的人，但我想让你知道，我真的很喜欢你，也是真的很珍惜你。<br><br>也许我们之间没有那么多甜甜的话，有时候也会有一些不开心，但我还是想和你一起走下去。只要我们还在一起，我就愿意慢慢改变自己，也愿意努力让我们可以一直陪在彼此身边。<br><br>希望以后的日子里，我们可以一起经历更多的事情，一起去想去的地方，一起留下更多属于我们的回忆。<br><br>生日快乐呀❤️<br>希望你的新一岁有更多开心，也希望未来的每一年，我都还可以陪你过生日。🎂";

function showLetter() {
  let i = 0;
  const element = document.getElementById('letter-text');
  element.innerHTML = "";
  
  function type() {
    if (i < LETTER_TEXT.length) {
      if (LETTER_TEXT.substring(i, i + 4) === "<br>") {
        element.innerHTML += "<br>";
        i += 4;
      } else {
        element.innerHTML += LETTER_TEXT.charAt(i);
        i++;
      }
      setTimeout(type, 25);
    }
  }
  
  type();
  showScreen('screen-letter');
}

document.getElementById('back-to-gifts').addEventListener('click', () => {
  showScreen('screen-gifts');
});
document.getElementById('back-to-gifts-2').addEventListener('click', () => {
  showScreen('screen-gifts');
});
document.getElementById('back-to-gifts-3').addEventListener('click', () => {
  showScreen('screen-gifts');
  pauseSong();
});

// ---------- SONG PLAYER CONTROLS ----------
const playPauseBtn = document.getElementById('play-pause-btn');
let songPlaying = false;

function playSong() {
  if (player && typeof player.playVideo === 'function') {
    player.playVideo();
  }
}

function pauseSong() {
  if (player && typeof player.pauseVideo === 'function') {
    player.pauseVideo();
  }
}

playPauseBtn.addEventListener('click', () => {
  songPlaying ? pauseSong() : playSong();
});
</script>
</body>
</html>
