<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Hero, My Dad — Happy Father's Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   MY HERO, MY DAD — DESIGN TOKENS
   ========================================================= */
:root {
  /* Palette */
  --color-cream: #F5F0E6;
  --color-parchment: #EDE3CE;
  --color-ivory: #FBF8F2;
  --color-beige: #DED0B4;
  --color-gray: #DAD6CD;
  --color-brown: #6B4732;
  --color-brown-deep: #3E2A1C;
  --color-forest: #3C5945;
  --color-forest-deep: #26392D;
  --color-navy: #2B3A4A;
  --color-navy-deep: #1C2733;
  --color-gold: #B4914F;
  --color-gold-soft: #D8C9A3;
  --color-ink: #34261C;
  --color-ink-soft: #786553;

  /* Type */
  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', sans-serif;
  --font-hand: 'Kalam', cursive;

  /* Motion */
  --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-slow: 900ms;
  --dur-med: 480ms;
  --dur-fast: 220ms;

  --radius-card: 14px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
  background: var(--color-cream);
  color: var(--color-ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }

:focus-visible {
  outline: 2px solid var(--color-gold);
  outline-offset: 3px;
}

/* =========================================================
   AMBIENT DUST LAYER (soft floating particles, shared)
   ========================================================= */
.dust-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
}

.dust {
  position: absolute;
  bottom: -20px;
  border-radius: 50%;
  background: var(--color-gold-soft);
  opacity: 0.5;
  animation-name: dust-rise;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
  will-change: transform, opacity;
}

@keyframes dust-rise {
  0% { transform: translate(0, 0); opacity: 0; }
  12% { opacity: 0.5; }
  88% { opacity: 0.4; }
  100% { transform: translate(var(--drift, 20px), -110vh); opacity: 0; }
}

/* =========================================================
   SCREENS
   ========================================================= */
#app {
  position: relative;
  min-height: 100vh;
  width: 100%;
}

.screen {
  position: absolute;
  inset: 0;
  min-height: 100vh;
  opacity: 0;
  transform: translateY(16px);
  transition: opacity var(--dur-slow) var(--ease-soft),
              transform var(--dur-slow) var(--ease-soft);
}

.screen--active {
  position: relative;
  opacity: 1;
  transform: translateY(0);
}

/* =========================================================
   SHARED: BACK BUTTON
   ========================================================= */
.back-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 10;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: none;
  cursor: pointer;
  background: rgba(251,248,242,0.9);
  color: var(--color-ink);
  padding: 10px 16px 10px 12px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.9rem;
  box-shadow: 0 6px 16px -6px rgba(46,32,22,0.35);
  backdrop-filter: blur(4px);
  transition: transform var(--dur-fast) var(--ease-soft);
}

.back-btn:active { transform: scale(0.95); }

/* =========================================================
   PAGE 1 — WELCOME SCREEN
   ========================================================= */
#screen-welcome {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 56px 28px 48px;
  background: radial-gradient(120% 90% at 50% 0%, var(--color-parchment) 0%, var(--color-cream) 55%);
  overflow: hidden;
}

.welcome__frame {
  position: relative;
  width: 78vw;
  max-width: 300px;
  aspect-ratio: 4 / 5;
  border-radius: 10px;
  padding: 10px;
  background: linear-gradient(160deg, var(--color-gold) 0%, var(--color-gold-soft) 100%);
  box-shadow: 0 24px 48px -20px rgba(46,32,22,0.45);
  opacity: 0;
  transform: translateY(-10px) scale(0.97);
  animation: rise-in var(--dur-slow) var(--ease-soft) forwards;
  animation-delay: 120ms;
}

.welcome__frame-inner {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 4px;
  overflow: hidden;
  background: linear-gradient(150deg, var(--color-navy) 0%, var(--color-brown) 60%, var(--color-forest) 100%);
}

.welcome__hero-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.welcome__frame-inner.no-image {
  display: flex;
  align-items: center;
  justify-content: center;
}

.welcome__frame-fallback-icon {
  display: none;
  width: 40px;
  height: 40px;
  color: rgba(251,248,242,0.75);
}

.welcome__frame-inner.no-image .welcome__frame-fallback-icon {
  display: block;
}

.welcome__content {
  margin-top: 32px;
  max-width: 340px;
}

.welcome__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2rem, 8vw, 2.6rem);
  line-height: 1.12;
  letter-spacing: -0.01em;
  margin: 0 0 14px;
  color: var(--color-ink);
  opacity: 0;
  transform: translateY(12px);
  animation: rise-in var(--dur-slow) var(--ease-soft) forwards;
  animation-delay: 320ms;
}

.welcome__subtitle {
  font-size: 1.02rem;
  color: var(--color-ink-soft);
  line-height: 1.55;
  margin: 0 0 34px;
  opacity: 0;
  transform: translateY(12px);
  animation: rise-in var(--dur-slow) var(--ease-soft) forwards;
  animation-delay: 480ms;
}

.btn {
  border: none;
  cursor: pointer;
  border-radius: 999px;
  font-family: var(--font-body);
  font-weight: 600;
  letter-spacing: 0.01em;
  transition: transform var(--dur-fast) var(--ease-soft),
              box-shadow var(--dur-fast) var(--ease-soft);
}

.btn:active { transform: scale(0.97); }

.btn--primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 16px 32px;
  font-size: 1rem;
  color: var(--color-ivory);
  background: linear-gradient(135deg, var(--color-forest-deep), var(--color-forest));
  box-shadow: 0 12px 26px -10px rgba(38, 57, 45, 0.55);
}

.btn--primary:hover {
  box-shadow: 0 16px 30px -10px rgba(38, 57, 45, 0.65);
}

.btn__icon {
  transition: transform var(--dur-fast) var(--ease-soft);
}

.btn--primary:hover .btn__icon {
  transform: translateX(3px);
}

.welcome__cta {
  opacity: 0;
  transform: translateY(12px);
  animation: rise-in var(--dur-slow) var(--ease-soft) forwards;
  animation-delay: 640ms;
}

@keyframes rise-in {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* =========================================================
   PAGE 2 — MAIN MENU
   ========================================================= */
#screen-menu {
  min-height: 100vh;
  background: linear-gradient(180deg, var(--color-cream) 0%, var(--color-parchment) 100%);
  padding: 72px 24px 56px;
}

.menu__intro {
  text-align: center;
  max-width: 420px;
  margin: 0 auto 32px;
}

.menu__eyebrow {
  font-family: var(--font-hand);
  font-size: 1.3rem;
  color: var(--color-forest);
  margin: 0 0 6px;
}

.menu__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.6rem, 6.5vw, 2rem);
  line-height: 1.25;
  margin: 0;
  color: var(--color-ink);
}

.menu__cards {
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-width: 460px;
  margin: 0 auto;
}

.menu-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  text-align: left;
  border: none;
  cursor: pointer;
  padding: 22px 22px 22px 20px;
  border-radius: var(--radius-card);
  background: var(--color-ivory);
  box-shadow: 0 14px 28px -18px rgba(46,32,22,0.4);
  overflow: hidden;
  opacity: 0;
  transform: translateY(16px);
  animation: rise-in var(--dur-slow) var(--ease-soft) forwards;
  transition: transform var(--dur-med) var(--ease-soft),
              box-shadow var(--dur-med) var(--ease-soft);
}

.screen--active .menu-card:nth-child(1) { animation-delay: 150ms; }
.screen--active .menu-card:nth-child(2) { animation-delay: 280ms; }
.screen--active .menu-card:nth-child(3) { animation-delay: 410ms; }

.menu-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 18px 34px -18px rgba(46,32,22,0.5);
}

.menu-card:active { transform: scale(0.98); }

/* Ticket-stub notch + perforation, echoing a keepsake ticket */
.menu-card::before {
  content: "";
  position: absolute;
  top: 50%;
  right: 86px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--color-cream);
  transform: translateY(-50%);
}

.menu-card::after {
  content: "";
  position: absolute;
  top: 14px;
  bottom: 14px;
  right: 95px;
  width: 1px;
  background-image: linear-gradient(var(--color-beige) 60%, transparent 0%);
  background-size: 1px 8px;
  background-repeat: repeat-y;
}

.menu-card__icon {
  flex: none;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-ivory);
}

.menu-card--letter .menu-card__icon { background: linear-gradient(160deg, var(--color-brown), var(--color-brown-deep)); }
.menu-card--memories .menu-card__icon { background: linear-gradient(160deg, var(--color-navy), var(--color-navy-deep)); }
.menu-card--wishes .menu-card__icon { background: linear-gradient(160deg, var(--color-forest), var(--color-forest-deep)); }

.menu-card__icon svg { width: 24px; height: 24px; }

.menu-card__body {
  flex: 1;
  min-width: 0;
  padding-right: 30px;
}

.menu-card__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--color-ink);
  margin: 0 0 3px;
}

.menu-card__desc {
  font-size: 0.88rem;
  color: var(--color-ink-soft);
  margin: 0;
  line-height: 1.4;
}

/* =========================================================
   PAGE 3A — LOVE NOTE
   ========================================================= */
#screen-letter {
  min-height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  background: linear-gradient(180deg, var(--color-navy) 0%, var(--color-parchment) 42%);
}

.letter-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

.letter-bg__image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.28;
}

.letter-bg__veil {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(28,39,51,0.6) 0%, rgba(237,227,206,0.94) 68%);
}

.music-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 10;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(251,248,242,0.9);
  color: var(--color-forest);
  box-shadow: 0 6px 16px -6px rgba(46,32,22,0.35);
  backdrop-filter: blur(4px);
  transition: transform var(--dur-fast) var(--ease-soft);
}

.music-btn:active { transform: scale(0.92); }

.music-btn.is-playing {
  animation: music-pulse 1.8s ease-in-out infinite;
}

@keyframes music-pulse {
  0%, 100% { box-shadow: 0 6px 16px -6px rgba(46,32,22,0.35), 0 0 0 0 rgba(60,89,69,0.5); }
  50% { box-shadow: 0 6px 16px -6px rgba(46,32,22,0.35), 0 0 0 8px rgba(60,89,69,0); }
}

.letter-wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 100px 22px 64px;
}

.letter-eyebrow {
  font-family: var(--font-hand);
  font-size: 1.3rem;
  color: var(--color-gold);
  text-align: center;
  margin: 0 0 16px;
}

.letter-paper {
  position: relative;
  background: var(--color-ivory);
  border-radius: 6px;
  padding: 34px 26px 46px;
  min-height: 260px;
  box-shadow: 0 24px 48px -20px rgba(28,39,51,0.4);
  border-top: 3px solid var(--color-gold);
}

.letter-text {
  margin: 0;
  font-family: var(--font-hand);
  font-size: 1.4rem;
  line-height: 1.6;
  color: var(--color-ink);
  white-space: pre-wrap;
  display: inline;
}

.letter-cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background: var(--color-ink);
  vertical-align: text-bottom;
  margin-left: 2px;
  animation: blink 0.9s step-end infinite;
}

.letter-cursor.is-done { display: none; }

@keyframes blink {
  50% { opacity: 0; }
}

/* =========================================================
   PAGE 3B — HAPPY MEMORIES
   ========================================================= */
#screen-memories {
  min-height: 100vh;
  background: linear-gradient(180deg, var(--color-gray) 0%, var(--color-cream) 32%);
  padding-bottom: 60px;
}

.memories-head {
  text-align: center;
  padding: 90px 24px 30px;
}

.memories-eyebrow {
  font-family: var(--font-hand);
  font-size: 1.3rem;
  color: var(--color-navy);
  margin: 0 0 6px;
}

.memories-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.4rem, 6vw, 1.8rem);
  margin: 0 0 8px;
  color: var(--color-ink);
}

.memories-hint {
  font-size: 0.9rem;
  color: var(--color-ink-soft);
  margin: 0;
}

.album {
  position: relative;
  max-width: 380px;
  margin: 0 auto;
  padding: 12px 24px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 34px;
}

.album-item {
  position: relative;
  width: 82%;
  max-width: 260px;
  background: var(--color-ivory);
  padding: 10px 10px 44px;
  border-radius: 2px;
  box-shadow: 0 16px 30px -14px rgba(46,32,22,0.4);
  cursor: pointer;
  border: none;
  transform: rotate(var(--tilt, 0deg));
  transition: transform var(--dur-med) var(--ease-soft);
  opacity: 0;
  animation: rise-in var(--dur-slow) var(--ease-soft) forwards;
}

.screen--active .album-item:nth-child(1) { --tilt: -2.4deg; animation-delay: 150ms; }
.screen--active .album-item:nth-child(2) { --tilt: 1.8deg; animation-delay: 300ms; }
.screen--active .album-item:nth-child(3) { --tilt: -1.4deg; animation-delay: 450ms; }

.album-item:hover { transform: rotate(0deg) translateY(-4px); }

.album-item__img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  display: block;
  background: linear-gradient(135deg, var(--color-navy), var(--color-brown));
}

.album-item__caption {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 10px;
  text-align: center;
}

.album-item__date {
  display: block;
  font-family: var(--font-hand);
  font-size: 1.05rem;
  color: var(--color-ink-soft);
}

@media (min-width: 640px) {
  .album {
    max-width: 640px;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
}

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--dur-med) var(--ease-soft), visibility 0s linear var(--dur-med);
}

.lightbox.is-open {
  opacity: 1;
  visibility: visible;
  transition: opacity var(--dur-med) var(--ease-soft), visibility 0s linear 0s;
}

.lightbox__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(26, 22, 17, 0.78);
  backdrop-filter: blur(2px);
}

.lightbox__panel {
  position: relative;
  z-index: 2;
  background: var(--color-ivory);
  border-radius: 6px;
  padding: 18px 18px 24px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  transform: scale(0.92);
  transition: transform var(--dur-med) var(--ease-soft);
}

.lightbox.is-open .lightbox__panel {
  transform: scale(1);
}

.lightbox__image {
  width: 100%;
  border-radius: 2px;
  display: block;
  margin-bottom: 14px;
  background: linear-gradient(135deg, var(--color-navy), var(--color-brown));
}

.lightbox__caption {
  margin: 0 0 4px;
  font-family: var(--font-hand);
  font-size: 1.25rem;
  color: var(--color-ink);
}

.lightbox__date {
  margin: 0;
  font-size: 0.82rem;
  color: var(--color-ink-soft);
}

.lightbox__close {
  position: absolute;
  top: -14px;
  right: -14px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: var(--color-ivory);
  color: var(--color-ink);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 14px -6px rgba(46,32,22,0.4);
}

/* =========================================================
   PAGE 3C — WISHES (ENVELOPES)
   ========================================================= */
#screen-wishes {
  min-height: 100vh;
  background: linear-gradient(180deg, var(--color-cream) 0%, var(--color-beige) 130%);
  padding-bottom: 60px;
}

.wishes-head {
  text-align: center;
  padding: 90px 24px 30px;
}

.wishes-eyebrow {
  font-family: var(--font-hand);
  font-size: 1.3rem;
  color: var(--color-forest);
  margin: 0 0 6px;
}

.wishes-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.4rem, 6vw, 1.8rem);
  margin: 0 0 8px;
  color: var(--color-ink);
}

.wishes-hint {
  font-size: 0.9rem;
  color: var(--color-ink-soft);
  margin: 0;
}

.envelopes {
  max-width: 420px;
  margin: 8px auto 0;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.envelope {
  position: relative;
  width: 100%;
  aspect-ratio: 5 / 3;
  cursor: pointer;
  perspective: 900px;
}

.envelope__body {
  position: absolute;
  inset: 0;
  border-radius: 8px;
  overflow: hidden;
  background: linear-gradient(160deg, var(--color-brown) 0%, var(--color-brown-deep) 100%);
  box-shadow: 0 16px 30px -16px rgba(46,32,22,0.5);
}

.envelope__body-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.9;
}

.envelope__pocket {
  position: absolute;
  inset: 0;
  clip-path: polygon(0 0, 50% 46%, 100% 0, 100% 100%, 0 100%);
  background: linear-gradient(160deg, rgba(0,0,0,0.08), rgba(0,0,0,0.22));
  z-index: 2;
}

.envelope__flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 58%;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  background: linear-gradient(160deg, var(--color-brown) 0%, var(--color-brown-deep) 100%);
  transform-origin: top center;
  transform: rotateX(0deg);
  transition: transform var(--dur-med) var(--ease-soft);
  z-index: 4;
  box-shadow: 0 6px 10px -6px rgba(0,0,0,0.3);
}

.envelope__seal {
  position: absolute;
  top: 32%;
  left: 50%;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 35% 30%, var(--color-gold), #8C6E3B 75%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-brown-deep);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.95rem;
  box-shadow: 0 4px 8px -3px rgba(0,0,0,0.4);
  z-index: 5;
  transition: opacity var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
}

.envelope.is-open .envelope__flap {
  transform: rotateX(-180deg);
}

.envelope.is-open .envelope__seal {
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.7);
}

.envelope__letter {
  position: absolute;
  left: 6%;
  right: 6%;
  bottom: 8%;
  background: var(--color-ivory);
  border-radius: 4px;
  padding: 14px 16px;
  box-shadow: 0 10px 20px -10px rgba(46,32,22,0.5);
  transform: translateY(18%);
  opacity: 0;
  transition: transform var(--dur-med) var(--ease-soft), opacity var(--dur-med) var(--ease-soft);
  z-index: 1;
}

.envelope.is-open .envelope__letter {
  transform: translateY(-10%);
  opacity: 1;
  z-index: 6;
}

.envelope__letter-text {
  margin: 0;
  font-family: var(--font-hand);
  font-size: 1.15rem;
  line-height: 1.35;
  color: var(--color-ink);
}

.envelope__label {
  position: absolute;
  left: 16px;
  bottom: 12px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: rgba(251,248,242,0.75);
  z-index: 3;
}

</style>
</head>
<body>

<div id="dust-layer" class="dust-layer" aria-hidden="true"></div>

<main id="app">

  <!-- ============ PAGE 1: WELCOME SCREEN ============ -->
  <section id="screen-welcome" class="screen screen--active" data-screen="welcome">
    <div class="welcome__frame">
      <div class="welcome__frame-inner" id="welcome-frame-inner">
        <img class="welcome__hero-image" src="images/templates/my-dad-my-hero/hero.jpeg" alt="Dad" onerror="this.style.display='none'; this.parentElement.classList.add('no-image');">
        <svg class="welcome__frame-fallback-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 12c2.5 0 4.5-2 4.5-4.5S14.5 3 12 3 7.5 5 7.5 7.5 9.5 12 12 12z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <div class="welcome__content">
      <h1 class="welcome__title">Happy Father&rsquo;s Day</h1>
      <p class="welcome__subtitle">Thank you for being my greatest strength.</p>

      <button type="button" class="btn btn--primary welcome__cta" data-action="enter-menu">
        <span>See Inside</span>
        <svg class="btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- ============ PAGE 2: MAIN MENU ============ -->
  <section id="screen-menu" class="screen" data-screen="menu">
    <div class="menu__intro">
      <p class="menu__eyebrow">A little memory box</p>
      <h2 class="menu__title">Everything kept safe for you, Dad</h2>
    </div>

    <div class="menu__cards">

      <button type="button" class="menu-card menu-card--letter" data-action="go:letter">
        <span class="menu-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </span>
        <span class="menu-card__body">
          <span class="menu-card__title">Love Note</span>
          <span class="menu-card__desc">A letter written just for you.</span>
        </span>
      </button>

      <button type="button" class="menu-card menu-card--memories" data-action="go:memories">
        <span class="menu-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="14" height="14" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M7 14l2.5-3 2 2L15 9l2 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.2" fill="currentColor"/></svg>
        </span>
        <span class="menu-card__body">
          <span class="menu-card__title">Happy Memories</span>
          <span class="menu-card__desc">A few moments worth keeping.</span>
        </span>
      </button>

      <button type="button" class="menu-card menu-card--wishes" data-action="go:wishes">
        <span class="menu-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 6l8 7 8-7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </span>
        <span class="menu-card__body">
          <span class="menu-card__title">Wishes</span>
          <span class="menu-card__desc">Five little envelopes, five thank-yous.</span>
        </span>
      </button>

    </div>
  </section>

  <!-- ============ PAGE 3A: LOVE NOTE ============ -->
  <section id="screen-letter" class="screen" data-screen="letter">
    <div class="letter-bg">
      <img class="letter-bg__image" src="images/templates/my-dad-my-hero/letter-background.jpg" alt="" aria-hidden="true" onerror="this.style.display='none'">
      <div class="letter-bg__veil"></div>
    </div>

    <button type="button" class="back-btn" data-action="go:menu" aria-label="Back to menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Menu</span>
    </button>

    <button type="button" class="music-btn" id="music-toggle" aria-label="Play background music" aria-pressed="false">
      <svg class="music-btn__icon music-btn__icon--play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 5v14l11-7-11-7z"/>
      </svg>
      <svg class="music-btn__icon music-btn__icon--pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none;">
        <path d="M7 5h4v14H7zM13 5h4v14h-4z"/>
      </svg>
    </button>

    <div class="letter-wrap">
      <p class="letter-eyebrow">✒️ A letter for Dad</p>
      <div class="letter-paper">
        <p class="letter-text" id="letter-text" aria-live="polite"></p>
        <span class="letter-cursor" id="letter-cursor"></span>
      </div>
    </div>
  </section>

  <!-- ============ PAGE 3B: HAPPY MEMORIES ============ -->
  <section id="screen-memories" class="screen" data-screen="memories">
    <button type="button" class="back-btn" data-action="go:menu" aria-label="Back to menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Menu</span>
    </button>

    <div class="memories-head">
      <p class="memories-eyebrow">📷 A small photo album</p>
      <h2 class="memories-title">Moments worth keeping</h2>
      <p class="memories-hint">Tap any photo to look closer</p>
    </div>

    <div class="album" id="album"></div>
  </section>

  <!-- Memory lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox__backdrop" data-action="close-lightbox"></div>
    <div class="lightbox__panel">
      <button type="button" class="lightbox__close" data-action="close-lightbox" aria-label="Close photo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <img id="lightbox-image" class="lightbox__image" src="" alt="">
      <p id="lightbox-caption" class="lightbox__caption"></p>
      <p id="lightbox-date" class="lightbox__date"></p>
    </div>
  </div>

  <!-- ============ PAGE 3C: WISHES ============ -->
  <section id="screen-wishes" class="screen" data-screen="wishes">
    <button type="button" class="back-btn" data-action="go:menu" aria-label="Back to menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Menu</span>
    </button>

    <div class="wishes-head">
      <p class="wishes-eyebrow">✉️ Five little envelopes</p>
      <h2 class="wishes-title">Wishes for Dad</h2>
      <p class="wishes-hint">Tap an envelope to open it</p>
    </div>

    <div class="envelopes" id="envelopes"></div>
  </section>

</main>

<audio id="bg-music" src="audio/perfect.mp3" loop preload="none"></audio>

<script>
/* =========================================================
   MY HERO, MY DAD — CONFIGURATION
   Edit these values to personalize the gift. Nothing below
   this block needs to change for everyday edits.
   ========================================================= */
const CONFIG = {
  heroImage: "images/templates/my-dad-my-hero/hero.jpeg",
  letterBackground: "images/templates/my-dad-my-hero/letter-background.jpg",
  music: "audio/perfect.mp3",
  envelopeImage: "images/templates/my-dad-my-hero/envelope.png",

  memories: [
    { image: "images/templates/my-dad-my-hero/memory-01.jpg", date: "Summer, 2008", caption: "The first time you taught me to ride a bike." },
    { image: "images/templates/my-dad-my-hero/memory-02.jpg", date: "Winter, 2015", caption: "Late nights at the kitchen table, homework and hot cocoa." },
    { image: "images/templates/my-dad-my-hero/memory-03.jpg", date: "Today", caption: "Still my hero, all these years later." }
  ]
};

const loveLetter = `Dear Dad,

Thank you for always supporting me.

Thank you for teaching me to be strong.

I wouldn't be who I am today without you.

Happy Father's Day.

Love,
Your Child`;

const wishes = [
  "Thank you for always believing in me.",
  "Thank you for teaching me to work hard.",
  "Thank you for always protecting our family.",
  "Thank you for every sacrifice.",
  "Happy Father's Day. I love you."
];

// ---------- Ambient floating dust particles ----------
function spawnDust(count = 12) {
  const layer = document.getElementById('dust-layer');
  if (!layer) return;

  for (let i = 0; i < count; i++) {
    const mote = document.createElement('div');
    mote.className = 'dust';

    const size = 3 + Math.random() * 5;
    const left = Math.random() * 100;
    const duration = 16 + Math.random() * 14;
    const delay = Math.random() * -24;
    const drift = (Math.random() * 60 - 30) + 'px';

    mote.style.width = `${size}px`;
    mote.style.height = `${size}px`;
    mote.style.left = `${left}vw`;
    mote.style.setProperty('--drift', drift);
    mote.style.animationDuration = `${duration}s`;
    mote.style.animationDelay = `${delay}s`;

    layer.appendChild(mote);
  }
}

// ---------- Screen navigation ----------
const screens = {};

function registerScreens() {
  document.querySelectorAll('.screen').forEach((el) => {
    screens[el.dataset.screen] = el;
    // Inactive screens are fully removed from layout flow (not just faded
    // out) so they can never stack extra blank space above the visible one.
    if (!el.classList.contains('screen--active')) {
      el.style.display = 'none';
    }
  });
}

function goToScreen(name) {
  const target = screens[name];
  if (!target) {
    console.warn(`Screen "${name}" is not built yet.`);
    return;
  }
  Object.values(screens).forEach((el) => {
    el.classList.remove('screen--active');
    el.style.display = 'none';
  });
  target.style.display = '';
  target.classList.add('screen--active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  handleScreenEnter(name);
}

// ---------- Happy Memories: build album + lightbox ----------
let albumBuilt = false;

function buildAlbum() {
  if (albumBuilt) return;
  albumBuilt = true;

  const album = document.getElementById('album');
  if (!album) return;

  CONFIG.memories.forEach((memory, index) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'album-item';
    item.dataset.memoryIndex = String(index);
    item.setAttribute('aria-label', `Open memory: ${memory.caption}`);

    item.innerHTML = `
      <img class="album-item__img" src="${memory.image}" alt="${memory.caption}" loading="lazy"
           onerror="this.src='';this.style.background='linear-gradient(135deg, var(--color-navy), var(--color-brown))'">
      <span class="album-item__caption">
        <span class="album-item__date">${memory.date}</span>
      </span>
    `;

    album.appendChild(item);
  });
}

function openLightbox(index) {
  const memory = CONFIG.memories[index];
  if (!memory) return;

  const lightbox = document.getElementById('lightbox');
  const image = document.getElementById('lightbox-image');
  const caption = document.getElementById('lightbox-caption');
  const date = document.getElementById('lightbox-date');
  if (!lightbox || !image) return;

  image.onerror = () => { image.onerror = null; image.src = ''; };
  image.src = memory.image;
  image.alt = memory.caption;
  caption.textContent = memory.caption;
  date.textContent = memory.date;

  lightbox.classList.add('is-open');
  lightbox.setAttribute('aria-hidden', 'false');
}

function closeLightbox() {
  const lightbox = document.getElementById('lightbox');
  if (!lightbox) return;
  lightbox.classList.remove('is-open');
  lightbox.setAttribute('aria-hidden', 'true');
}

// ---------- Wishes: build envelopes ----------
let envelopesBuilt = false;

function buildEnvelopes() {
  if (envelopesBuilt) return;
  envelopesBuilt = true;

  const wrap = document.getElementById('envelopes');
  if (!wrap) return;

  wishes.forEach((wish, index) => {
    const item = document.createElement('div');
    item.className = 'envelope';
    item.dataset.wishIndex = String(index);

    item.innerHTML = `
      <div class="envelope__body">
        <img class="envelope__body-image" src="${CONFIG.envelopeImage}" alt="" aria-hidden="true"
             onerror="this.remove()">
        <div class="envelope__pocket"></div>
        <span class="envelope__label">Wish ${index + 1}</span>
      </div>
      <div class="envelope__flap"></div>
      <div class="envelope__seal" aria-hidden="true">${index + 1}</div>
      <div class="envelope__letter">
        <p class="envelope__letter-text">${wish}</p>
      </div>
    `;

    item.addEventListener('click', () => {
      item.classList.toggle('is-open');
    });

    wrap.appendChild(item);
  });
}

// ---------- Wire up actions ----------
function initActions() {
  document.body.addEventListener('click', (e) => {
    const trigger = e.target.closest('[data-action]');
    if (trigger) {
      const action = trigger.dataset.action;

      if (action === 'enter-menu') {
        goToScreen('menu');
      } else if (action === 'close-lightbox') {
        closeLightbox();
      } else if (action.startsWith('go:')) {
        goToScreen(action.split(':')[1]);
      }
      return;
    }

    const albumItem = e.target.closest('.album-item');
    if (albumItem) {
      openLightbox(Number(albumItem.dataset.memoryIndex));
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
}

// ---------- Love Note: typing animation ----------
let letterTyped = false;

function typeLetter() {
  if (letterTyped) return;
  letterTyped = true;

  const textEl = document.getElementById('letter-text');
  const cursorEl = document.getElementById('letter-cursor');
  if (!textEl) return;

  const characters = Array.from(loveLetter);
  let i = 0;

  function typeNext() {
    if (i >= characters.length) {
      cursorEl?.classList.add('is-done');
      return;
    }
    textEl.textContent += characters[i];
    i++;
    const char = characters[i - 1];
    let delay = 30 + Math.random() * 26;
    if (char === '\n') delay = 260;
    else if (',.!?'.includes(char)) delay = 230;
    setTimeout(typeNext, delay);
  }

  setTimeout(typeNext, 500);
}

// ---------- Love Note: background music (off by default) ----------
function initMusicToggle() {
  const btn = document.getElementById('music-toggle');
  const audio = document.getElementById('bg-music');
  if (!btn || !audio) return;

  const playIcon = btn.querySelector('.music-btn__icon--play');
  const pauseIcon = btn.querySelector('.music-btn__icon--pause');

  btn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play().catch(() => {
        // Missing file or autoplay restriction — fail quietly
      });
      btn.classList.add('is-playing');
      btn.setAttribute('aria-pressed', 'true');
      btn.setAttribute('aria-label', 'Pause background music');
      playIcon.style.display = 'none';
      pauseIcon.style.display = '';
    } else {
      audio.pause();
      btn.classList.remove('is-playing');
      btn.setAttribute('aria-pressed', 'false');
      btn.setAttribute('aria-label', 'Play background music');
      playIcon.style.display = '';
      pauseIcon.style.display = 'none';
    }
  });
}

// ---------- Trigger per-screen effects on navigation ----------
function handleScreenEnter(name) {
  if (name === 'letter') {
    typeLetter();
  } else if (name === 'memories') {
    buildAlbum();
  } else if (name === 'wishes') {
    buildEnvelopes();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  spawnDust();
  registerScreens();
  initActions();
  initMusicToggle();
});
</script>
</body>
</html>
