<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Love Knows No Distance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF3ED;
    --warm-white: #FFFCF9;
    --soft-pink: #F2CFCB;
    --beige: #EDE1D3;
    --dusty-rose: #C98B87;
    --burgundy: #6E2A34;
    --ink: #4A372E;
    --ink-soft: #8A7267;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Cormorant Garamond', serif;
    background: var(--cream);
    color: var(--ink);
  }

  .app {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    overflow: hidden;
    background: var(--warm-white);
  }

  /* ================= Progress spine ================= */
  .progress-spine {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(255, 252, 249, 0.82);
    backdrop-filter: blur(6px);
    padding: 8px 14px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(74, 55, 46, 0.08);
  }

  .spine-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--soft-pink);
    transition: background 0.4s ease, transform 0.4s ease;
    position: relative;
  }

  .spine-dot.done { background: var(--dusty-rose); }

  .spine-dot.current {
    background: var(--burgundy);
    transform: scale(1.3);
  }

  .spine-dot.current::after {
    content: "\2764";
    position: absolute;
    top: -17px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--burgundy);
  }

  .spine-link {
    width: 12px;
    height: 1px;
    background: repeating-linear-gradient(
      to right,
      var(--dusty-rose) 0px, var(--dusty-rose) 2px,
      transparent 2px, transparent 4px
    );
    opacity: 0.6;
  }

  /* ================= Shared page frame ================= */
  .page {
    position: absolute;
    inset: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateX(24px);
    pointer-events: none;
    transition: opacity 0.55s ease, transform 0.55s ease;
  }

  .page.active {
    position: relative;
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .page.leaving {
    opacity: 0;
    transform: translateX(-24px);
  }

  /* ---------- Next button (shared style) ---------- */
  .next-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: center;
    padding: 14px 38px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--dusty-rose) 0%, var(--burgundy) 100%);
    color: var(--warm-white);
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(110, 42, 52, 0.28);
    animation: pulse 2.8s ease-in-out infinite;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .next-btn:hover { transform: translateY(-2px); }
  .next-btn:active { transform: translateY(0) scale(0.97); }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 20px rgba(110, 42, 52, 0.28); }
    50% { box-shadow: 0 8px 26px rgba(110, 42, 52, 0.42); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ================= PAGE 1: HERO ================= */
  .hero-page {
    justify-content: flex-end;
  }

  .hero-image-wrap {
    position: relative;
    width: 100%;
    height: 70vh;
    overflow: hidden;
    opacity: 0;
    animation: heroFadeIn 1.6s ease-out forwards;
  }

  @keyframes heroFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .hero-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: linear-gradient(155deg, var(--soft-pink) 0%, var(--beige) 100%);
  }

  .hero-image-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(74, 55, 46, 0) 55%, rgba(74, 55, 46, 0.55) 100%);
  }

  /* floating particles over the hero */
  .hero-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  .hero-particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 252, 249, 0.75);
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    12% { opacity: 0.8; }
    88% { opacity: 0.5; }
    100% { transform: translateY(-90vh) translateX(var(--drift-x, 10px)); opacity: 0; }
  }

  .hero-content {
    position: relative;
    z-index: 3;
    padding: 26px 26px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 16px;
  }

  .hero-content h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.25;
    color: var(--ink);
    opacity: 0;
    animation: fadeUp 1s ease-out 0.5s forwards;
  }

  .hero-content h1 .heart { color: var(--burgundy); }

  .hero-subtitle {
    font-style: italic;
    font-size: 18px;
    color: var(--ink-soft);
    max-width: 300px;
    line-height: 1.55;
    opacity: 0;
    animation: fadeUp 1s ease-out 0.75s forwards;
  }

  .hero-content .next-btn {
    margin-top: 6px;
    opacity: 0;
    animation: fadeUp 1s ease-out 1s forwards, pulse 2.8s ease-in-out 1.8s infinite;
  }

  /* ================= Placeholder pages (built in later steps) ================= */
  .stub-page {
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 30px;
    gap: 18px;
  }

  .stub-page .stub-label {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--ink-soft);
  }

  @media (max-width: 360px) {
    .hero-content h1 { font-size: 27px; }
  }
</style>
</head>
<body>

  <div class="app" id="app">

    <!-- progress spine, filled in as JS renders it -->
    <div class="progress-spine" id="progressSpine"></div>

    <!-- ================= PAGE 1: HERO ================= -->
    <section class="page hero-page active" data-page="1">
      <div class="hero-image-wrap">
        <img class="hero-image" id="heroImage" src="images/templates/across-the-miles/hero.jpeg" alt="A moment together" />
        <div class="hero-particles" id="heroParticles"></div>
      </div>

      <div class="hero-content">
        <h1>Love Knows No Distance <span class="heart">&#10084;</span></h1>
        <p class="hero-subtitle">No matter how many miles separate us, you never feel far from my heart.</p>
        <button class="next-btn" data-next>Next &rarr;</button>
      </div>
    </section>

    <!-- ================= PAGE 2: DISTANCE JOURNEY (stub) ================= -->
    <section class="page stub-page" data-page="2">
      <p class="stub-label">Distance Journey<br>coming in the next step</p>
      <button class="next-btn" data-next>Next &rarr;</button>
    </section>

    <!-- ================= PAGE 3: LOVE JAR (stub) ================= -->
    <section class="page stub-page" data-page="3">
      <p class="stub-label">Love Jar<br>coming in a later step</p>
      <button class="next-btn" data-next>Next &rarr;</button>
    </section>

    <!-- ================= PAGE 4: BOUQUET (stub) ================= -->
    <section class="page stub-page" data-page="4">
      <p class="stub-label">Bouquet<br>coming in a later step</p>
      <button class="next-btn" data-next>Next &rarr;</button>
    </section>

    <!-- ================= PAGE 5: FINAL MESSAGE (stub) ================= -->
    <section class="page stub-page" data-page="5">
      <p class="stub-label">Final Message<br>coming in a later step</p>
    </section>

  </div>

<script>
  // =====================================================
  // CONFIG — everything editable lives here
  // =====================================================
  const CONFIG = {
    heroImage: "images/templates/across-the-miles/hero.jpeg",
    mapImage: "images/templates/across-the-miles//map.jpeg",
    loveJarImage: "images/templates/across-the-miles//love-jar.jpeg",
    bouquetImage: "images/templates/across-the-miles//bouquet.jpeg",
    finalImage: "images/templates/across-the-miles//final-photo.jpeg",
    music: "images/templates/across-the-miles//music.mp3"
  };

  const TOTAL_PAGES = 5;

  // =====================================================
  // Progress spine (dots + dashed links, one per page)
  // =====================================================
  const spineEl = document.getElementById('progressSpine');

  function renderSpine(current) {
    spineEl.innerHTML = '';
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      const dot = document.createElement('div');
      dot.className = 'spine-dot';
      if (i < current) dot.classList.add('done');
      if (i === current) dot.classList.add('current');
      spineEl.appendChild(dot);

      if (i < TOTAL_PAGES) {
        const link = document.createElement('div');
        link.className = 'spine-link';
        spineEl.appendChild(link);
      }
    }
  }

  // =====================================================
  // Page navigation
  // =====================================================
  let currentPage = 1;
  const pages = Array.from(document.querySelectorAll('.page'));

  function goToPage(n) {
    if (n < 1 || n > TOTAL_PAGES || n === currentPage) return;
    const outgoing = pages.find(p => Number(p.dataset.page) === currentPage);
    const incoming = pages.find(p => Number(p.dataset.page) === n);

    outgoing.classList.add('leaving');
    outgoing.classList.remove('active');

    setTimeout(() => {
      outgoing.classList.remove('leaving');
    }, 550);

    incoming.classList.add('active');
    currentPage = n;
    renderSpine(currentPage);
  }

  document.querySelectorAll('[data-next]').forEach(btn => {
    btn.addEventListener('click', () => goToPage(currentPage + 1));
  });

  renderSpine(currentPage);

  // =====================================================
  // Hero page: floating particles
  // =====================================================
  function spawnHeroParticles() {
    const container = document.getElementById('heroParticles');
    const count = 12;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'hero-particle';
      const size = 3 + Math.random() * 4;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = (Math.random() * 100) + '%';
      p.style.bottom = '-5%';
      p.style.animationDuration = (7 + Math.random() * 7) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      p.style.setProperty('--drift-x', (Math.random() * 40 - 20) + 'px');
      container.appendChild(p);
    }
  }

  spawnHeroParticles();
</script>

</body>
</html>
