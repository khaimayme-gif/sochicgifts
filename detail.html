<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>So Chic Gifts — Options</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --white:#FFFFFF;
  --paper:#F6F6F3;
  --ink:#141410;
  --ink-soft:#63635C;
  --ink-faint:#9C9C93;
  --line:#E5E5DF;
  --accent:#E8402A;
  --accent-dark:#B92E1C;
}

html{scroll-behavior:smooth}
body{background:var(--white);color:var(--ink);font-family:'Inter',sans-serif;font-weight:400;overflow-x:hidden}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif}
a{text-decoration:none}

/* ===== NAV ===== */
nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 52px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  transition:padding .25s ease;
}
nav.scrolled{padding:14px 52px}
@media(max-width:768px){nav{padding:18px 24px}nav.scrolled{padding:12px 24px}}

.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo-img{width:34px;height:34px;border-radius:4px;object-fit:cover}
.nav-logo-text{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.01em}

.nav-links{display:flex;align-items:center;gap:36px}
.nav-links a{font-size:13px;font-weight:500;color:var(--ink-soft);text-decoration:none;transition:color .2s ease}
.nav-links a:hover{color:var(--ink)}
.nav-links a.current{color:var(--ink)}
@media(max-width:820px){.nav-links .hide-md{display:none}}
@media(max-width:560px){.nav-links .hide-sm{display:none}}

.nav-cta{padding:10px 22px;background:var(--ink);border:1px solid var(--ink);border-radius:5px;color:var(--white);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;transition:all .2s ease;white-space:nowrap}
.nav-cta:hover{background:var(--accent);border-color:var(--accent)}

/* ===== PAGE HERO ===== */
.detail-hero{padding:150px 52px 0;background:var(--white)}
@media(max-width:768px){.detail-hero{padding:104px 24px 0}}
.detail-hero-inner{max-width:1080px;margin:0 auto}
.detail-route{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:22px;flex-wrap:wrap}
.detail-route .dash{display:inline-block;width:18px;height:1px;background:var(--accent)}
.detail-route a{color:var(--ink-soft)}
.detail-route a:hover{color:var(--ink)}
.detail-route .current{color:var(--ink);font-weight:500}

.detail-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:36px}
.detail-photo{
  flex-shrink:0;width:64px;height:64px;border-radius:8px;
  background:var(--paper);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;
}
.detail-photo img{width:100%;height:100%;object-fit:cover}
.detail-title{font-size:clamp(28px,3.6vw,38px);font-weight:600;letter-spacing:-.02em;color:var(--ink);margin-bottom:6px}
.detail-tagline{font-size:14px;color:var(--ink-soft);line-height:1.6}

/* ===== TABS ===== */
.tab-row{max-width:1080px;margin:0 auto;display:flex;gap:32px;border-bottom:1px solid var(--line)}
.tab{font-size:13.5px;font-weight:500;color:var(--ink-soft);padding-bottom:16px;cursor:pointer;border-bottom:2px solid transparent;user-select:none;transition:color .2s ease}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}

/* ===== PRODUCT GRID ===== */
.grid-section{padding:44px 52px 0;background:var(--white)}
@media(max-width:768px){.grid-section{padding:36px 24px 0}}

.group-block{max-width:1080px;margin:0 auto 44px}
.group-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}

.product-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);
}
@media(max-width:900px){.product-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.product-grid{grid-template-columns:1fr}}

.product-card{background:var(--white);padding:26px 22px;display:flex;flex-direction:column}
.product-photo{
  width:100%;aspect-ratio:1/1;border-radius:8px;
  background:var(--paper);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;margin-bottom:18px;overflow:hidden;position:relative;
}
.product-photo img{width:100%;height:100%;object-fit:cover}
.best-tag{
  position:absolute;top:10px;left:10px;
  background:var(--ink);color:var(--white);
  font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;
  padding:3px 9px;border-radius:4px;letter-spacing:.03em;
}
.product-code{font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:600;color:var(--accent);letter-spacing:.03em;margin-bottom:8px}
.product-name{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.35}
.product-detail{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:14px;flex-grow:1}
.product-price{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--ink)}
.product-price.placeholder{color:var(--accent);border-bottom:1px dashed var(--accent);display:inline-block}

/* ===== NOTES ===== */
.notes-section{padding:64px 52px 100px;background:var(--white)}
@media(max-width:768px){.notes-section{padding:48px 24px 72px}}
.notes-inner{max-width:640px;margin:0 auto}
.custom-note{border-left:2px solid var(--accent);padding-left:24px;margin-bottom:24px}
.custom-note-label{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.03em;margin-bottom:8px;display:block}
.custom-note-text{font-size:14px;color:var(--ink-soft);line-height:1.75}
.mmk-note{font-size:12.5px;color:var(--ink-faint);text-align:center}

</style>
</head>
<body>

<!-- NAV -->
<nav id="main-nav">
  <a href="index.html" class="nav-logo">
    <img src="images/main/main-logo.png" alt="So Chic Gifts" class="nav-logo-img">
    <span class="nav-logo-text">So Chic Gifts</span>
  </a>
  <div class="nav-links">
    <a href="menu.html" class="current">Menu</a>
    <a href="templates.html" class="hide-md">Digital Gift</a>
    <a href="surprise-box.html">Gift Box</a>
  </div>
  <a href="#" class="nav-cta">Enquire</a>
</nav>

<!-- HERO -->
<section class="detail-hero">
  <div class="detail-hero-inner">
    <span class="detail-route">
      <span class="dash"></span>
      <a href="index.html">Home</a> &nbsp;/&nbsp; <a href="menu.html">Menu</a> &nbsp;/&nbsp; <span class="current" id="crumbName"></span>
    </span>
    <div class="detail-head">
      <div class="detail-photo" id="avatarLg"></div>
      <div>
        <h1 class="detail-title" id="catName"></h1>
        <p class="detail-tagline" id="catTagline"></p>
      </div>
    </div>
  </div>
  <div class="tab-row">
    <div class="tab active" id="tabTH">Thailand</div>
    <div class="tab" id="tabJP">Japan</div>
  </div>
</section>

<!-- GRID -->
<section class="grid-section">
  <div id="optionsGrid"></div>
</section>

<!-- NOTES -->
<section class="notes-section">
  <div class="notes-inner">
    <div class="custom-note">
      <span class="custom-note-label">Custom orders</span>
      <p class="custom-note-text" id="customNote"></p>
    </div>
    <p class="mmk-note">Paying in MMK? We'll convert to the equivalent amount at checkout.</p>
  </div>
</section>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const catId = params.get('cat');
const cat = CATEGORIES.find(c => c.id === catId) || CATEGORIES[0];

const avatarLg = document.getElementById('avatarLg');
if (cat.photo) {
  avatarLg.innerHTML = `<img src="${cat.photo}" alt="${cat.name}">`;
} else {
  avatarLg.textContent = cat.icon;
}

document.getElementById('catName').textContent = cat.name;
document.getElementById('catTagline').textContent = cat.tagline;
document.getElementById('crumbName').textContent = cat.name;
document.getElementById('customNote').textContent = cat.note;
document.title = `So Chic Gifts — ${cat.name}`;

let currentTab = 'th';
const tabTH = document.getElementById('tabTH');
const tabJP = document.getElementById('tabJP');
const optionsGrid = document.getElementById('optionsGrid');

function renderOptions(){
  const symbol = currentTab==='th' ? '฿' : '¥';
  const list = cat[currentTab];
  const hasGroups = list.some(o => o.group);

  const cardHTML = (o, i) => {
    const photoHTML = o.photo
      ? `<img src="${o.photo}" alt="${o.name}">`
      : cat.icon;
    const bestHTML = o.best ? `<span class="best-tag">Best seller</span>` : '';
    const priceHTML = o.price===null
      ? `<span class="product-price placeholder">${symbol}—</span>`
      : `<span class="product-price">${symbol}${o.price.toLocaleString()}</span>`;
    const code = `${cat.code}${String(i+1).padStart(2,'0')}`;
    return `
      <div class="product-card">
        <div class="product-photo">${bestHTML}${photoHTML}</div>
        <span class="product-code">${code}</span>
        <div class="product-name">${o.name}</div>
        <p class="product-detail">${o.detail || ''}</p>
        ${priceHTML}
      </div>
    `;
  };

  if (!hasGroups) {
    optionsGrid.innerHTML = `<div class="product-grid">${list.map((o,i)=>cardHTML(o,i)).join('')}</div>`;
    return;
  }

  const groupNames = [...new Set(list.map(o => o.group))];
  optionsGrid.innerHTML = groupNames.map(groupName => {
    const groupItems = list.filter(o => o.group === groupName);
    return `
      <div class="group-block">
        <div class="group-title">${groupName}</div>
        <div class="product-grid">${groupItems.map((o,i)=>cardHTML(o,i)).join('')}</div>
      </div>
    `;
  }).join('');
}

tabTH.addEventListener('click', ()=>{
  currentTab='th'; tabTH.classList.add('active'); tabJP.classList.remove('active'); renderOptions();
});
tabJP.addEventListener('click', ()=>{
  currentTab='jp'; tabJP.classList.add('active'); tabTH.classList.remove('active'); renderOptions();
});

renderOptions();

const nav = document.getElementById('main-nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 40);
}, { passive: true });
</script>

</body>
</html>
