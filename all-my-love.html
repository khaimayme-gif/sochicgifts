<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>You've Got One Letter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&family=Dancing+Script:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#ffffff;
  --bg-2:#fdf5f4;
  --bg-3:#f8e6e4;
  --pink-light:#f6cfcb;
  --pink-mid:#e2372c;
  --rose:#d81f26;
  --rose-deep:#a3121a;
  --plum:#2e2a2c;
  --plum-soft:#7a6a6a;
  --cream:#fffefd;
  --display:'Baloo 2','Noto Sans Thai',sans-serif;
  --body:'Nunito',sans-serif;
  --script:'Dancing Script',cursive;
  --serif:'EB Garamond',serif;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; width:100%; overflow:hidden; font-family:var(--body); color:var(--plum); -webkit-font-smoothing:antialiased; }

#stage{
  position:relative; width:100%; height:100%;
  background:
    radial-gradient(circle at 20% 15%, #ffffff 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, var(--bg-3) 0%, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%, var(--bg-3));
  overflow:hidden;
}

/* ambient floating hearts */
.ambient{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.ambient span{ position:absolute; bottom:-10%; opacity:0; color:var(--rose); animation:float-up linear infinite; }
@keyframes float-up{
  0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
  10%{ opacity:.45; }
  90%{ opacity:.25; }
  100%{ transform:translateY(-115vh) translateX(var(--drift,20px)) rotate(20deg); opacity:0; }
}

.scene{
  position:absolute; inset:0; max-width:480px; margin:0 auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:8vh 7vw; text-align:center;
  opacity:0; pointer-events:none;
  transition:opacity .6s ease;
}
.scene.active{ opacity:1; pointer-events:all; z-index:2; }

/* ================= SCENE 1: ENVELOPE COVER ================= */
.env-wrap{
  position:relative; width:min(70vw,270px); cursor:pointer;
  animation:env-float 3.6s ease-in-out infinite;
  perspective:900px;
}
@keyframes env-float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-9px);} }
.env-wrap.opening{ animation:none; pointer-events:none; }
.env-wrap svg{ width:100%; display:block; filter:drop-shadow(0 16px 28px rgba(168,18,63,.22)); }
#lid{
  transform-origin:50% 4%;
  transform-box:fill-box;
  transform-style:preserve-3d;
}
#envSeal{
  transform-box:fill-box; transform-origin:50% 50%;
  transition:opacity .2s ease .1s, transform .4s cubic-bezier(.2,1.5,.4,1) .1s;
}
.env-wrap.opening #envSeal{ opacity:0; transform:scale(1.4) translateY(-14px); }

.env-wrap.opening::after{
  content:'';
  position:absolute; inset:-30px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(216,31,38,.25) 0%, transparent 70%);
  animation:envGlowBurst .8s ease-out forwards;
  pointer-events:none; z-index:-1;
}
@keyframes envGlowBurst{
  0%{ opacity:0; transform:scale(.5); }
  50%{ opacity:1; }
  100%{ opacity:0; transform:scale(1.6); }
}
.env-wrap.opening #lid{
  animation:envOpenFlap 1.8s cubic-bezier(.4,0,.15,1) forwards;
}
@keyframes envOpenFlap{
  0%   { transform:rotateX(0deg); filter:none; }
  40%  { transform:rotateX(-100deg); filter:brightness(1.12); }
  100% { transform:rotateX(-185deg); filter:brightness(.92); }
}
.got-letter{
  font-family:var(--display); font-weight:800; font-size:clamp(22px,6vw,27px);
  color:var(--plum); margin-top:26px; line-height:1.3;
}
.got-letter .heart-em{ color:var(--rose); }

.open-btn{
  margin-top:26px; font-family:var(--display); font-weight:700; font-size:16px; color:#fff;
  background:linear-gradient(135deg, var(--pink-mid), var(--rose-deep));
  border:none; padding:15px 42px; border-radius:999px;
  box-shadow:0 14px 26px -10px rgba(168,18,63,.55);
  cursor:pointer; letter-spacing:.02em;
  transition:transform .18s ease, box-shadow .18s ease;
}
.open-btn:hover{ transform:translateY(-2px) scale(1.03); }
.open-btn:active{ transform:translateY(0) scale(.96); }
.open-btn:disabled{ opacity:.6; pointer-events:none; }

/* full-screen heart burst, spawned via JS using image files (not emoji) */
.heart-fill{
  position:fixed; pointer-events:none; z-index:40;
  opacity:0; transform:scale(.3) rotate(0deg);
  transition:transform 1s cubic-bezier(.2,.7,.3,1), opacity .5s ease;
}

/* ================= SCENE 2: LOVE NOTE ================= */
#scene-note{ padding:6vh 6vw 6vh; justify-content:flex-start; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.note-hero{
  width:100%; max-width:320px; margin:0 auto;
  border-radius:16px; overflow:hidden;
  box-shadow:0 16px 34px -14px rgba(0,0,0,.22);
}
.note-hero img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:linear-gradient(140deg,#f3e6e9,#ece0dd); }
.note-eyebrow{ font-family:var(--script); font-size:26px; color:var(--rose-deep); margin-top:4px; }
.note-heading{ font-family:var(--display); font-weight:700; font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--plum-soft); margin-top:2px; }

.photo-row{ display:flex; justify-content:center; gap:14px; margin:26px 0 6px; flex-wrap:wrap; }
.polaroid{
  width:96px; background:#fff; padding:8px 8px 14px; border-radius:6px;
  box-shadow:0 10px 20px -8px rgba(168,18,63,.3);
}
.polaroid:nth-child(1){ transform:rotate(-7deg); }
.polaroid:nth-child(2){ transform:rotate(4deg); margin-top:10px; }
.polaroid:nth-child(3){ transform:rotate(-3deg); }
.polaroid img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:linear-gradient(140deg,#fbdedb,#f6c4bf); border-radius:2px; }

.letter-paper{
  width:100%; max-width:360px; margin:22px auto 10px;
  background:linear-gradient(166deg,#fefef8 0%,#fff8ee 40%,#fffcf5 80%);
  border-radius:14px; padding:28px 22px 24px; text-align:left;
  box-shadow:0 30px 70px rgba(130,38,28,.18), 0 10px 24px rgba(0,0,0,.08);
}
.letter-eyebrow{ font-size:10px; letter-spacing:.4em; text-transform:uppercase; color:rgba(178,20,80,.55); margin-bottom:10px; text-align:center; }
.letter-to{ font-family:var(--script); font-size:28px; color:#8b1a1a; margin-bottom:14px; text-align:center; }
.letter-body{ font-family:var(--serif); font-style:italic; font-size:14.5px; line-height:1.85; color:#3c1e1e; white-space:pre-line; }
.letter-sign{ margin-top:18px; text-align:right; }
.letter-sign .ls-lbl{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(122,62,44,.5); }
.letter-sign .ls-name{ font-family:var(--script); font-size:22px; color:#8b1a1a; }

.music-pill{
  position:fixed; top:16px; right:16px; z-index:30;
  display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,.88); backdrop-filter:blur(8px);
  border-radius:999px; padding:8px 14px 8px 8px;
  box-shadow:0 8px 20px rgba(168,18,63,.16);
}
.music-btn{
  width:28px; height:28px; border-radius:50%; border:none; background:var(--rose);
  color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px;
}
.music-label{ font-size:11px; font-weight:700; color:var(--plum-soft); }
</style>
</head>
<body>

<div id="stage">
  <div class="ambient" id="ambient"></div>

  <!-- ================= SCENE 1: ENVELOPE COVER ================= -->
  <section class="scene active" id="scene-cover">
    <div class="env-wrap" id="envWrap">
      <svg viewBox="0 0 260 175" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="16" width="248" height="152" rx="14" fill="#fff7f6" stroke="#7a1418" stroke-width="3.5"/>
        <path d="M10 24 L130 108 L250 24" fill="none" stroke="#7a1418" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 168 L96 100" stroke="#7a1418" stroke-width="3" stroke-linecap="round"/>
        <path d="M248 168 L164 100" stroke="#7a1418" stroke-width="3" stroke-linecap="round"/>
        <g id="lid">
          <path d="M6 30 C6 22, 12 16, 20 16 L240 16 C248 16, 254 22, 254 30 L130 100 Z" fill="#fdeceb" stroke="#7a1418" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M60 32 L82 44" stroke="#7a1418" stroke-width="2" stroke-linecap="round" opacity=".4"/>
          <path d="M178 32 L200 44" stroke="#7a1418" stroke-width="2" stroke-linecap="round" opacity=".4"/>
          <path d="M120 62 C120 50, 128 42, 138 42 C146 42, 152 48, 152 56 C152 68, 138 78, 130 84 C122 78, 108 68, 108 56 C108 48, 114 42, 122 42 C126 42, 129 44, 130 47"
                fill="#d81f26" stroke="#7a1418" stroke-width="3" stroke-linejoin="round" transform="translate(0,4) scale(0.62) translate(72,10)"/>
        </g>
        <path d="M55 46 C55 42, 58 39, 62 39 C65 39, 68 42, 68 45 C68 49, 63 53, 60 55 C57 53, 52 49, 52 45 C52 42, 55 39, 58 39 C60 39, 61 40, 62 42"
              fill="#f2b3b0" stroke="#7a1418" stroke-width="2" stroke-linejoin="round"/>
        <path d="M192 46 C192 42, 195 39, 199 39 C202 39, 205 42, 205 45 C205 49, 200 53, 197 55 C194 53, 189 49, 189 45 C189 42, 192 39, 195 39 C197 39, 198 40, 199 42"
              fill="#f2b3b0" stroke="#7a1418" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="got-letter">You've got one letter <span class="heart-em">💌</span></p>
    <button class="open-btn" id="openBtn">Open Now</button>
  </section>

  <!-- ================= SCENE 2: LOVE NOTE ================= -->
  <section class="scene" id="scene-note">
    <div class="music-pill">
      <button class="music-btn" id="musicBtn">♫</button>
      <span class="music-label" id="musicLabel">our song</span>
    </div>

    <div class="note-hero">
      <img id="notePhoto" src="images/templates/all-my-heart/memory1.jpg" alt="" onerror="this.closest('.note-hero').style.display='none'">
    </div>

    <div class="note-heading">a little letter from my heart</div>
    <div class="note-eyebrow">For You</div>

    <div class="photo-row" id="photoRow"></div>

    <div class="letter-paper">
      <div class="letter-eyebrow">A letter for</div>
      <div class="letter-to" id="letterTo"></div>
      <div class="letter-body" id="letterBody"></div>
      <div class="letter-sign">
        <div class="ls-lbl">Forever yours</div>
        <div class="ls-name" id="letterSign"></div>
      </div>
    </div>
  </section>
</div>

<audio id="bgMusic" src="audio/perfect.mp3" loop preload="auto"></audio>

<script>
/* ==========================================
   CONFIGURATION — customize here
   ========================================== */
const CONFIG = {
  letterTo: "My Love",
  letterBody:
`Every time I write one of these, I mean it a little more than the last.

Thank you for being the person I get to come home to, in every sense of the word. For the ordinary days that don't feel ordinary because you're in them, and for staying close even when things got hard.

I hope this little letter finds you smiling. That's really all I want.`,
  letterSign: "Yours",
  music: "audio/perfect.mp3"
};

/* heart images used for the burst when the envelope opens — add as many as you like */
const HEART_IMAGES = [
  "images/templates/all-my-love/pink-heart.png",
  "images/templates/all-my-love/red-heart.png"
];

/* photos shown above the letter — add or remove freely */
const photos = [
  "images/templates/all-my-love/memory1.jpg",
  "images/templates/all-my-love/memory1.jpg",
  "images/templates/all-my-love/memory1.jpg"
];

/* ==========================================
   RENDER PHOTOS + LETTER
   ========================================== */
const photoRow = document.getElementById('photoRow');
photos.forEach(src => {
  const p = document.createElement('div');
  p.className = 'polaroid';
  p.innerHTML = `<img src="${src}" alt="" onerror="this.closest('.polaroid').style.display='none'">`;
  photoRow.appendChild(p);
});
document.getElementById('letterTo').textContent = CONFIG.letterTo;
document.getElementById('letterBody').textContent = CONFIG.letterBody;
document.getElementById('letterSign').textContent = CONFIG.letterSign;

/* ==========================================
   AMBIENT FLOATING HEARTS
   ========================================== */
const ambient = document.getElementById('ambient');
for(let i=0;i<12;i++){
  const s = document.createElement('span');
  s.textContent = '♥';
  s.style.left = Math.random()*100 + '%';
  s.style.fontSize = (10 + Math.random()*14) + 'px';
  s.style.setProperty('--drift', (Math.random()*60-30)+'px');
  s.style.animationDuration = (7 + Math.random()*8) + 's';
  s.style.animationDelay = (Math.random()*8) + 's';
  ambient.appendChild(s);
}

/* ==========================================
   SCENE SWITCHING
   ========================================== */
function showScene(id){
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ==========================================
   ENVELOPE OPEN + HEART BURST
   ========================================== */
const envWrap = document.getElementById('envWrap');
const openBtn = document.getElementById('openBtn');
const bgMusic = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
const musicLabel = document.getElementById('musicLabel');

function spawnHeartFill(){
  const count = 70;
  for(let i=0;i<count;i++){
    const img = document.createElement('img');
    img.className = 'heart-fill';
    img.src = HEART_IMAGES[Math.floor(Math.random()*HEART_IMAGES.length)];
    img.alt = '';
    img.onerror = () => img.remove();

    const size = 22 + Math.random()*30;
    img.style.width = size + 'px';
    img.style.left = (Math.random()*100) + 'vw';
    img.style.top = (Math.random()*100) + 'vh';
    document.body.appendChild(img);

    const delay = Math.random()*900;
    const rot = (Math.random()-0.5) * 60;
    const driftY = (Math.random()-0.5) * 40;

    setTimeout(() => {
      img.style.opacity = String(0.75 + Math.random()*0.25);
      img.style.transform = `scale(1) rotate(${rot}deg) translateY(${driftY}px)`;
    }, delay);

    setTimeout(() => {
      img.style.opacity = '0';
      img.style.transform += ' scale(.7)';
    }, delay + 1500);

    setTimeout(() => img.remove(), delay + 2100);
  }
}

openBtn.addEventListener('click', () => {
  if(envWrap.classList.contains('opening')) return;
  openBtn.disabled = true;

  // start music on this user gesture so it can play automatically once we land on the note page
  bgMusic.play().then(() => {
    musicBtn.textContent = '❚❚';
    musicLabel.textContent = 'our song';
  }).catch(() => {
    musicBtn.textContent = '♫';
    musicLabel.textContent = 'tap to play';
  });

  envWrap.classList.add('opening');
  setTimeout(() => spawnHeartFill(), 500);
  setTimeout(() => showScene('scene-note'), 3200);
});

musicBtn.addEventListener('click', () => {
  if(bgMusic.paused){
    bgMusic.play().then(() => {
      musicBtn.textContent = '❚❚';
      musicLabel.textContent = 'our song';
    }).catch(() => {});
  } else {
    bgMusic.pause();
    musicBtn.textContent = '♫';
    musicLabel.textContent = 'paused';
  }
});
</script>
</body>
</html>
