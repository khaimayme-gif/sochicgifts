<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A Letter Across the Distance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF3EC;
    --warm-white: #FFFCF9;
    --blush: #F0D9D6;
    --dusty-rose: #C98B87;
    --dusty-rose-deep: #B06E6A;
    --ink: #4A372E;
    --ink-soft: #7A6459;
    --gold: #C9A876;
    --paper-shadow: rgba(74, 55, 46, 0.12);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Cormorant Garamond', serif;
    background: #FFFFFF;
    color: var(--ink);
    min-height: 100vh;
    position: relative;
  }

  .app {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ---------- Paper particles (shared) ---------- */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }

  .particle {
    position: absolute;
    top: -5%;
    width: 6px;
    height: 8px;
    background: var(--dusty-rose);
    opacity: 0.35;
    border-radius: 1px;
    animation: drift linear infinite;
  }

  @keyframes drift {
    0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.3; }
    100% { transform: translateY(110vh) translateX(var(--drift-x, 20px)) rotate(200deg); opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ================= PAGE 1: SEALED LETTER ================= */
  .page-1 {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px;
    position: relative;
    z-index: 2;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .page-1.leaving {
    opacity: 0;
    transform: scale(0.96);
    pointer-events: none;
  }

  .envelope-wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 3 / 2.1;
    animation: float 5s ease-in-out infinite, fadeIn 1.4s ease-out;
    filter: drop-shadow(0 18px 30px var(--paper-shadow));
    transition: transform 0.7s cubic-bezier(0.6, -0.28, 0.74, 0.05), opacity 0.6s ease;
  }

  .envelope-wrap.opening {
    animation: none;
    transform: scale(0.9) translateY(-14px);
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }

  .envelope-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 6px;
    display: block;
    background: linear-gradient(155deg, var(--warm-white) 0%, var(--blush) 100%);
    cursor: pointer;
  }

  .title-block {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-top: 40px;
    opacity: 0;
    animation: fadeIn 1.2s ease-out 0.6s forwards;
  }

  .title-block h1 {
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.01em;
    color: var(--ink);
    line-height: 1.25;
  }

  .title-block .heart { color: var(--dusty-rose-deep); }

  .subtitle {
    margin-top: 12px;
    font-style: italic;
    font-weight: 400;
    font-size: 18px;
    color: var(--ink-soft);
    max-width: 280px;
    line-height: 1.5;
  }

  .open-btn {
    position: relative;
    z-index: 2;
    margin-top: 34px;
    padding: 15px 46px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--dusty-rose) 0%, var(--dusty-rose-deep) 100%);
    color: var(--warm-white);
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(176, 110, 106, 0.4);
    opacity: 0;
    animation: fadeIn 1.2s ease-out 0.9s forwards;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .open-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(176, 110, 106, 0.5); }
  .open-btn:active { transform: translateY(0px) scale(0.97); }

  /* ================= PAGE 2: MESSAGE REVEAL ================= */
  .page-2 {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
  }

  .page-2.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* faded envelope image lingering behind the note, per spec */
  .page-2-bg {
    position: absolute;
    inset: 0;
    background-image: var(--bg-envelope-image, none);
    background-size: cover;
    background-position: center;
    filter: blur(14px) brightness(1.05);
    transform: scale(1.1);
    opacity: 0.35;
    z-index: 0;
  }

  .page-2-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.96));
  }

  .note-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    max-height: 82vh;
    overflow-y: auto;
    background: var(--warm-white);
    border-radius: 10px;
    padding: 36px 26px 30px;
    box-shadow: 0 22px 50px rgba(74, 55, 46, 0.18);
    border: 1px solid rgba(201, 139, 135, 0.2);
    transform: translateY(24px);
    opacity: 0;
    transition: transform 0.7s ease 0.15s, opacity 0.7s ease 0.15s;
  }

  .page-2.active .note-card {
    transform: translateY(0);
    opacity: 1;
  }

  .bouquet-img {
    display: block;
    width: 120px;
    height: auto;
    margin: 0 auto 14px;
    background: none;
    border: none;
    box-shadow: none;
    object-fit: contain;
  }

  .note-text {
    font-family: 'Caveat', cursive;
    font-size: 24px;
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
    min-height: 200px;
  }

  .note-text .cursor {
    display: inline-block;
    width: 2px;
    background: var(--dusty-rose-deep);
    margin-left: 2px;
    animation: blink 0.9s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .memory-trigger {
    display: block;
    margin: 26px auto 0;
    padding: 12px 30px;
    border: 1.5px solid var(--dusty-rose);
    border-radius: 999px;
    background: transparent;
    color: var(--dusty-rose-deep);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.5s ease, background 0.2s ease, color 0.2s ease;
  }

  .memory-trigger.visible { opacity: 1; }

  .memory-trigger:hover {
    background: var(--dusty-rose);
    color: var(--warm-white);
  }

  .memory-card {
    margin-top: 20px;
    text-align: center;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.6s ease, opacity 0.6s ease, margin-top 0.6s ease;
  }

  .memory-card.visible {
    max-height: 420px;
    opacity: 1;
  }

  .memory-photo {
    width: 100%;
    border-radius: 8px;
    display: block;
    box-shadow: 0 10px 24px rgba(74, 55, 46, 0.15);
  }

  .memory-caption {
    margin-top: 12px;
    font-style: italic;
    font-size: 16px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  /* floating particles specific to page 2 */
  .page-2 .particles { z-index: 0; }

  /* ---------- Music control ---------- */
  .music-btn {
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 6;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: var(--warm-white);
    box-shadow: 0 8px 20px rgba(74, 55, 46, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .music-btn.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .music-btn svg {
    width: 20px;
    height: 20px;
    fill: var(--dusty-rose-deep);
  }

  @media (max-width: 360px) {
    .title-block h1 { font-size: 26px; }
    .envelope-wrap { max-width: 270px; }
    .note-text { font-size: 22px; }
  }
</style>
</head>
<body>

  <div class="app">
    <div class="particles" id="particles"></div>

    <!-- ================= PAGE 1 ================= -->
    <div class="page-1" id="page1">
      <div class="envelope-wrap" id="envelopeWrap">
        <img
          class="envelope-img"
          id="envelopeImg"
          src="images/templates/miss-you-card/hero.jpeg"
          alt="A sealed handwritten letter"
        />
      </div>

      <div class="title-block">
        <h1>I Miss You So Much <span class="heart">&#10084;</span></h1>
        <p class="subtitle">Distance may keep us apart, but you're always on my mind.</p>
      </div>

      <button class="open-btn" id="openBtn">Open Now</button>
    </div>

    <!-- ================= PAGE 2 ================= -->
    <div class="page-2" id="page2">
      <div class="page-2-bg" id="page2Bg"></div>
      <div class="particles" id="particles2"></div>

      <div class="note-card">
        <img class="bouquet-img" src="images/templates/miss-you-card/bouquet.png" alt="" />
        <div class="note-text" id="noteText"></div>
        <button class="memory-trigger" id="memoryTrigger">One More Thing...</button>

        <div class="memory-card" id="memoryCard">
          <img class="memory-photo" src="images/templates/miss-you-card/memory-photo.jpg" alt="A shared memory" />
          <p class="memory-caption" id="memoryCaption">Remember this day? I still think about it. &#10084;</p>
        </div>
      </div>
    </div>

    <!-- ---------- Music control ---------- -->
    <button class="music-btn" id="musicBtn" aria-label="Play or pause music">
      <svg id="musicIconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="musicIconPause" viewBox="0 0 24 24" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <audio id="bgMusic" src="assets/music.mp3" loop preload="none"></audio>
  </div>

<script>
  // =====================================================
  // CONFIG — everything you'd want to edit lives here
  // =====================================================
  const CONFIG = {
    title: "I Miss You So Much",
    subtitle: "Distance may keep us apart, but you're always on my mind.",
    envelopeImage: "images/templates/miss-you-card/hero.png",
    music: "assets/music.mp3",
    hiddenMemory: "assets/memory-photo.jpg",
    memoryCaption: "Remember this day? I still think about it. \u2764"
  };

  // the letter itself, kept separate from the HTML so it's easy to rewrite
  const missingYouLetter = `Hi,

I know we're apart right now.

But I want you to know that I've been thinking about you every day.

I miss our conversations.

I miss your smile.

I miss all the little moments we shared.

I can't wait until we can create new memories together.

Until then...

Please know that someone is thinking about you.

I miss you so much.

\u2764`;

  // =====================================================
  // Paper particles (used on both pages)
  // =====================================================
  function spawnParticles(containerId, count) {
    const container = document.getElementById(containerId);
    if (!container) return;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const left = Math.random() * 100;
      const duration = 8 + Math.random() * 8;
      const delay = Math.random() * 10;
      const driftX = (Math.random() * 60 - 30) + 'px';
      p.style.left = left + 'vw';
      p.style.animationDuration = duration + 's';
      p.style.animationDelay = delay + 's';
      p.style.setProperty('--drift-x', driftX);
      container.appendChild(p);
    }
  }

  spawnParticles('particles', 14);
  spawnParticles('particles2', 10);

  // =====================================================
  // PAGE 1 -> PAGE 2 transition
  // =====================================================
  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  const envelopeWrap = document.getElementById('envelopeWrap');
  const envelopeImg = document.getElementById('envelopeImg');
  const openBtn = document.getElementById('openBtn');
  const page2Bg = document.getElementById('page2Bg');

  page2Bg.style.setProperty('--bg-envelope-image', `url("${CONFIG.envelopeImage}")`);

  let opened = false;

  function handleOpen() {
    if (opened) return;
    opened = true;

    envelopeWrap.classList.add('opening');
    page1.classList.add('leaving');

    startMusic();

    setTimeout(() => {
      page2.classList.add('active');
      startTyping();
    }, 550);
  }

  envelopeImg.addEventListener('click', handleOpen);
  openBtn.addEventListener('click', handleOpen);

  // =====================================================
  // Typing animation for the letter
  // =====================================================
  const noteTextEl = document.getElementById('noteText');
  const memoryTrigger = document.getElementById('memoryTrigger');

  function startTyping() {
    const text = missingYouLetter;
    let i = 0;
    noteTextEl.innerHTML = '';

    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.textContent = '\u00A0';

    function typeNext() {
      if (i < text.length) {
        const char = text.charAt(i);
        noteTextEl.textContent = text.slice(0, i + 1);
        noteTextEl.appendChild(cursor);
        i++;
        const pause = (char === '\n') ? 220 : 26 + Math.random() * 28;
        setTimeout(typeNext, pause);
      } else {
        cursor.remove();
        revealMemoryTrigger();
      }
    }

    typeNext();
  }

  function revealMemoryTrigger() {
    setTimeout(() => {
      memoryTrigger.classList.add('visible');
    }, 400);
  }

  // =====================================================
  // Hidden memory card
  // =====================================================
  const memoryCard = document.getElementById('memoryCard');

  memoryTrigger.addEventListener('click', () => {
    const isVisible = memoryCard.classList.toggle('visible');
    memoryTrigger.textContent = isVisible ? 'Hide' : 'One More Thing...';
  });

  // =====================================================
  // Background music
  // =====================================================
  const bgMusic = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  const musicIconPlay = document.getElementById('musicIconPlay');
  const musicIconPause = document.getElementById('musicIconPause');

  function startMusic() {
    musicBtn.classList.add('visible');
    bgMusic.play().then(() => {
      setPlayingIcon(true);
    }).catch(() => {
      // autoplay blocked by the browser, user can tap the control instead
      setPlayingIcon(false);
    });
  }

  function setPlayingIcon(isPlaying) {
    musicIconPlay.style.display = isPlaying ? 'none' : 'block';
    musicIconPause.style.display = isPlaying ? 'block' : 'none';
  }

  musicBtn.addEventListener('click', () => {
    if (bgMusic.paused) {
      bgMusic.play().then(() => setPlayingIcon(true)).catch(() => {});
    } else {
      bgMusic.pause();
      setPlayingIcon(false);
    }
  });
</script>

</body>
</html>
