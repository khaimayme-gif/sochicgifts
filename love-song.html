<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Happy Monthsary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#6b2540;
  --wine-deep:#4a1830;
  --pink:#ff9dbb;
  --pink-deep:#e2372c;
  --cream:#fff8f6;
  --plum:#2e2226;
  --plum-soft:#8a747c;
  --bg-1:#fff6f4;
  --bg-2:#fbe4e8;
  --bg-3:#f4d6dc;
  --display:'Baloo 2','Noto Sans Thai',sans-serif;
  --body:'Nunito',sans-serif;
  --script:'Dancing Script',cursive;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; width:100%; overflow:hidden; font-family:var(--body); color:var(--plum); -webkit-font-smoothing:antialiased; }

#stage{
  position:relative; width:100%; height:100%; overflow:hidden;
  background:
    radial-gradient(circle at 18% 12%, #fffdfc 0%, transparent 45%),
    radial-gradient(circle at 85% 82%, var(--bg-3) 0%, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%, var(--bg-3));
}

/* ambient floating music notes */
.ambient{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.ambient span{ position:absolute; bottom:-10%; opacity:0; color:var(--pink-deep); animation:float-up linear infinite; }
@keyframes float-up{
  0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
  10%{ opacity:.4; }
  90%{ opacity:.22; }
  100%{ transform:translateY(-115vh) translateX(var(--drift,20px)) rotate(-15deg); opacity:0; }
}

.scene{
  position:absolute; inset:0; max-width:480px; margin:0 auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:8vh 7vw; text-align:center;
  opacity:0; pointer-events:none;
  transition:opacity .5s ease;
}
.scene.active{ opacity:1; pointer-events:all; z-index:2; }

.back-btn{
  position:absolute; top:18px; left:18px; z-index:20;
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--body); font-size:13px; font-weight:700; color:var(--wine);
  background:rgba(255,255,255,.85); border:1px solid rgba(107,37,64,.15);
  border-radius:50px; padding:8px 16px 8px 12px; cursor:pointer;
  backdrop-filter:blur(8px);
}
.back-btn:active{ transform:scale(.95); }

/* ================= SCENE 1: CASSETTE COVER ================= */
.cassette-wrap{
  width:min(78vw,300px); animation:cas-float 3.8s ease-in-out infinite;
}
@keyframes cas-float{ 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-10px) rotate(1deg);} }
.cassette-wrap svg{ width:100%; display:block; filter:drop-shadow(0 18px 30px rgba(107,37,64,.28)); }
.reel{ animation:reel-spin 4s linear infinite; transform-origin:center; transform-box:fill-box; }
@keyframes reel-spin{ to{ transform:rotate(360deg); } }

.monthsary-title{
  font-family:var(--display); font-weight:800; font-size:clamp(24px,6.5vw,30px);
  color:var(--wine); margin-top:26px; line-height:1.3;
}

.next-btn{
  margin-top:28px; font-family:var(--display); font-weight:700; font-size:16px; color:#fff;
  background:linear-gradient(135deg, var(--pink-deep), var(--wine));
  border:none; padding:15px 46px; border-radius:999px;
  box-shadow:0 14px 26px -10px rgba(107,37,64,.5);
  cursor:pointer; letter-spacing:.02em;
  transition:transform .18s ease, box-shadow .18s ease;
}
.next-btn:hover{ transform:translateY(-2px) scale(1.03); }
.next-btn:active{ transform:translateY(0) scale(.96); }

.dots{ display:flex; gap:7px; margin-top:24px; }
.dots span{ width:6px; height:6px; border-radius:50%; background:var(--wine); opacity:.3; }
.dots span:first-child{ opacity:.9; width:16px; border-radius:4px; }

/* ================= SCENE 2: PIN ================= */
.pin-note{ font-size:30px; margin-bottom:8px; }
h2.pin-title{ font-family:var(--display); font-weight:700; font-size:20px; margin-bottom:4px; }
p.pin-hint{ font-size:13px; color:var(--plum-soft); font-weight:600; margin-bottom:22px; }
.pin-dots{ display:flex; gap:14px; margin-bottom:8px; }
.pin-dots span{ width:15px; height:15px; border-radius:50%; border:2px solid var(--wine); background:transparent; transition:background .15s, transform .15s; }
.pin-dots span.filled{ background:var(--wine); transform:scale(1.05); }
.pin-dots.error span{ border-color:#c0304f; background:#c0304f; animation:shake .35s ease; }
@keyframes shake{ 0%,100%{ transform:translateX(0);} 20%{ transform:translateX(-6px);} 40%{ transform:translateX(6px);} 60%{ transform:translateX(-4px);} 80%{ transform:translateX(4px);} }
.pin-error{ min-height:16px; font-size:12.5px; font-weight:700; color:#c0304f; margin-bottom:14px; }
.numpad{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; max-width:270px; }
.num-key{ height:62px; border-radius:16px; border:1.5px solid #f0d3da; background:#fff; font-family:var(--display); font-size:20px; font-weight:700; color:var(--plum); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .12s ease, background .12s ease, border-color .12s ease; }
.num-key:hover{ background:#fff0f2; border-color:var(--pink); }
.num-key:active{ transform:scale(.92); background:#ffe0e6; }
.num-key.zero{ grid-column:2; }
.num-key.del{ background:#fff4f5; color:#c0304f; border-color:transparent; font-size:16px; }

/* ================= SCENE 3: MENU ================= */
#scene-menu{ padding:0 0 30px; }
.menu-head{ text-align:center; padding:34px 20px 8px; }
.menu-head h1{ font-family:var(--script); font-size:34px; color:var(--wine); }
.menu-head p{ font-size:13px; font-weight:700; color:var(--plum-soft); margin-top:4px; letter-spacing:.02em; }
.menu-grid{ display:flex; flex-direction:column; gap:16px; padding:20px 22px 10px; width:100%; max-width:380px; }
.menu-card{
  background:#fff; border-radius:26px; padding:24px 20px 20px;
  box-shadow:0 16px 30px -14px rgba(107,37,64,.25); text-align:center;
  cursor:pointer; transition:transform .18s ease;
  display:flex; align-items:center; gap:16px; text-align:left;
}
.menu-card:active{ transform:scale(.97); }
.menu-icon{
  width:58px; height:58px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(140deg,#ffe0e6,#f6c4cd);
  display:flex; align-items:center; justify-content:center; font-size:24px;
}
.menu-card h3{ font-family:var(--display); font-size:16.5px; font-weight:700; color:var(--plum); }
.menu-card p{ font-size:12px; color:var(--plum-soft); font-weight:600; margin-top:3px; }

/* ================= SCENE 4: MEMORIES SLIDESHOW ================= */
.section-title{ font-family:var(--script); font-size:30px; color:var(--wine); text-align:center; padding:10px 20px 4px; }
.section-sub{ text-align:center; font-size:12.5px; font-weight:700; color:var(--plum-soft); margin-bottom:18px; }
.slideshow{
  position:relative; width:min(320px,80vw); aspect-ratio:4/5;
  border-radius:22px; overflow:hidden;
  box-shadow:0 20px 40px -16px rgba(107,37,64,.35);
  background:linear-gradient(140deg,#ffe0e6,#f6c4cd);
}
.slide{
  position:absolute; inset:0; opacity:0; transition:opacity .5s ease;
}
.slide.active{ opacity:1; }
.slide img{ width:100%; height:100%; object-fit:cover; display:block; }
.slide-caption{
  position:absolute; left:0; right:0; bottom:0;
  padding:26px 16px 14px;
  background:linear-gradient(to top, rgba(0,0,0,.55), transparent);
  color:#fff; font-family:var(--display); font-weight:700; font-size:14px; text-align:left;
}
.slide-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:36px; height:36px; border-radius:50%; border:none;
  background:rgba(255,255,255,.85); color:var(--wine); font-size:15px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 6px 16px rgba(0,0,0,.18);
}
.slide-prev{ left:-6px; }
.slide-next{ right:-6px; }
.slide-dots{ display:flex; gap:6px; margin-top:18px; }
.slide-dots span{ width:6px; height:6px; border-radius:50%; background:var(--wine); opacity:.25; cursor:pointer; transition:opacity .2s, width .2s; }
.slide-dots span.active{ opacity:1; width:16px; border-radius:4px; }

/* ================= SCENE 5: MUSIC PLAYER ================= */
.player-card{
  width:min(310px,80vw); background:linear-gradient(165deg, var(--wine), var(--wine-deep));
  border-radius:26px; padding:18px 18px 22px; color:#fff;
  box-shadow:0 24px 50px -16px rgba(74,24,48,.55);
}
.player-cover{
  width:100%; aspect-ratio:1/1; border-radius:14px; overflow:hidden;
  background:linear-gradient(140deg,#ffd9e0,#e8a9b6);
  margin-bottom:14px;
}
.player-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
.player-source{ font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.55); text-align:left; }
.player-title{ font-family:var(--display); font-size:17px; font-weight:700; text-align:left; margin-top:2px; }

.player-progress{ margin-top:16px; }
.player-bar{
  width:100%; height:5px; border-radius:4px; background:rgba(255,255,255,.28);
  position:relative; cursor:pointer;
}
.player-bar-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:4px; background:#fff; }
.player-times{ display:flex; justify-content:space-between; font-size:10.5px; font-weight:700; color:rgba(255,255,255,.7); margin-top:6px; }

.player-controls{ display:flex; align-items:center; justify-content:center; gap:34px; margin-top:16px; }
.player-controls button{ background:none; border:none; color:#fff; cursor:pointer; padding:6px; }
.p-play{ width:52px; height:52px; border-radius:50%; background:#fff; color:var(--wine); display:flex; align-items:center; justify-content:center; font-size:18px; }
.p-skip{ font-size:18px; opacity:.9; }

.player-volume{ display:flex; align-items:center; gap:10px; margin-top:20px; }
.player-volume span{ font-size:13px; opacity:.75; }
.vol-bar{ flex:1; height:4px; border-radius:4px; background:rgba(255,255,255,.28); position:relative; cursor:pointer; }
.vol-bar-fill{ position:absolute; left:0; top:0; bottom:0; width:70%; border-radius:4px; background:rgba(255,255,255,.85); }
</style>
</head>
<body>

<div id="stage">
  <div class="ambient" id="ambient"></div>

  <!-- ================= SCENE 1: CASSETTE COVER ================= -->
  <section class="scene active" id="scene-cover">
    <div class="cassette-wrap">
      <svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="14" width="284" height="162" rx="18" fill="#f2456b"/>
        <rect x="8" y="14" width="284" height="162" rx="18" fill="url(#casShine)" opacity=".18"/>
        <rect x="22" y="30" width="256" height="70" rx="8" fill="#ffe3ea"/>
        <rect x="22" y="30" width="256" height="26" rx="6" fill="#ffc7d4"/>
        <text x="150" y="48" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="700" font-size="15" fill="#8b1a35">I LOVE U ♥</text>
        <line x1="30" y1="66" x2="270" y2="66" stroke="#f0a9ba" stroke-width="2"/>
        <line x1="30" y1="74" x2="270" y2="74" stroke="#f0a9ba" stroke-width="2"/>
        <line x1="30" y1="82" x2="270" y2="82" stroke="#f0a9ba" stroke-width="2"/>
        <g class="reel">
          <circle cx="95" cy="70" r="20" fill="#4a1830"/>
          <circle cx="95" cy="70" r="7" fill="#ffe3ea"/>
          <rect x="93" y="53" width="4" height="10" fill="#ffe3ea"/>
          <rect x="93" y="77" width="4" height="10" fill="#ffe3ea"/>
          <rect x="78" y="68" width="10" height="4" fill="#ffe3ea"/>
          <rect x="102" y="68" width="10" height="4" fill="#ffe3ea"/>
        </g>
        <g class="reel">
          <circle cx="205" cy="70" r="20" fill="#4a1830"/>
          <circle cx="205" cy="70" r="7" fill="#ffe3ea"/>
          <rect x="203" y="53" width="4" height="10" fill="#ffe3ea"/>
          <rect x="203" y="77" width="4" height="10" fill="#ffe3ea"/>
          <rect x="188" y="68" width="10" height="4" fill="#ffe3ea"/>
          <rect x="212" y="68" width="10" height="4" fill="#ffe3ea"/>
        </g>
        <path d="M40 110 C 60 150, 100 150, 120 122 C 140 150, 160 150, 180 122 C 200 150, 240 150, 260 110" fill="none" stroke="#4a1830" stroke-width="2.5"/>
        <circle cx="60" cy="118" r="4" fill="#ffe3ea" stroke="#4a1830" stroke-width="1.5"/>
        <circle cx="150" cy="130" r="4" fill="#ffe3ea" stroke="#4a1830" stroke-width="1.5"/>
        <circle cx="240" cy="118" r="4" fill="#ffe3ea" stroke="#4a1830" stroke-width="1.5"/>
        <path d="M255 22 C255 18,258 15,262 15 C265 15,268 18,268 21 C268 25,262 30,258 33 C254 30,248 25,248 21 C248 18,251 15,254 15 C256 15,258 17,258 19" fill="#ffc7d4"/>
        <path d="M28 158 C28 154,31 151,35 151 C38 151,41 154,41 157 C41 161,35 166,31 169 C27 166,21 161,21 157 C21 154,24 151,27 151 C29 151,31 153,31 155" fill="#ffc7d4"/>
        <defs>
          <linearGradient id="casShine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <p class="monthsary-title" id="monthsaryTitle">Happy 5th Monthsary Baby</p>
    <button class="next-btn" id="nextBtn">Next</button>
    <div class="dots"><span></span><span></span><span></span></div>
  </section>

  <!-- ================= SCENE 2: PIN ================= -->
  <section class="scene" id="scene-pin">
    <div class="pin-note">🎵</div>
    <h2 class="pin-title">This part's just ours</h2>
    <p class="pin-hint">Enter the pin to continue</p>
    <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
    <div class="pin-error" id="pinError"></div>
    <div class="numpad" id="numpad">
      <button class="num-key" data-num="1">1</button>
      <button class="num-key" data-num="2">2</button>
      <button class="num-key" data-num="3">3</button>
      <button class="num-key" data-num="4">4</button>
      <button class="num-key" data-num="5">5</button>
      <button class="num-key" data-num="6">6</button>
      <button class="num-key" data-num="7">7</button>
      <button class="num-key" data-num="8">8</button>
      <button class="num-key" data-num="9">9</button>
      <button class="num-key zero" data-num="0">0</button>
      <button class="num-key del" id="delKey">⌫</button>
    </div>
  </section>

  <!-- ================= SCENE 3: MENU ================= -->
  <section class="scene" id="scene-menu">
    <div class="menu-head">
      <h1>Our Mixtape</h1>
      <p>♪ two hearts, one playlist ♪</p>
    </div>
    <div class="menu-grid">
      <div class="menu-card" data-target="scene-memories">
        <div class="menu-icon">📷</div>
        <div>
          <h3>Our Memories</h3>
          <p>every snapshot of us so far</p>
        </div>
      </div>
      <div class="menu-card" data-target="scene-player">
        <div class="menu-icon">🎧</div>
        <div>
          <h3>Our Love Song</h3>
          <p>press play, it's ours</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= SCENE 4: MEMORIES SLIDESHOW ================= -->
  <section class="scene" id="scene-memories">
    <button class="back-btn" data-back="scene-menu">‹ Back</button>
    <div class="section-title">Our Memories</div>
    <div class="section-sub">every snapshot of us so far</div>
    <div class="slideshow" id="slideshow">
      <button class="slide-nav slide-prev" id="slidePrev">‹</button>
      <button class="slide-nav slide-next" id="slideNext">›</button>
    </div>
    <div class="slide-dots" id="slideDots"></div>
  </section>

  <!-- ================= SCENE 5: MUSIC PLAYER ================= -->
  <section class="scene" id="scene-player">
    <button class="back-btn" data-back="scene-menu">‹ Back</button>
    <div class="player-card">
      <div class="player-cover">
        <img id="playerCover" src="images/templates/my-love-song/memory1.jpg" alt="" onerror="this.style.opacity=0">
      </div>
      <div class="player-source">Now Playing</div>
      <div class="player-title" id="playerTitle">Our Love Song</div>

      <div class="player-progress">
        <div class="player-bar" id="playerBar">
          <div class="player-bar-fill" id="playerBarFill"></div>
        </div>
        <div class="player-times">
          <span id="playerCurrent">0:00</span>
          <span id="playerRemaining">-0:00</span>
        </div>
      </div>

      <div class="player-controls">
        <button class="p-skip" id="playerBack">⏪</button>
        <button class="p-play" id="playerPlay">▶</button>
        <button class="p-skip" id="playerFwd">⏩</button>
      </div>

      <div class="player-volume">
        <span>🔈</span>
        <div class="vol-bar" id="volBar"><div class="vol-bar-fill" id="volBarFill"></div></div>
        <span>🔊</span>
      </div>
    </div>
  </section>
</div>

<audio id="songAudio" src="audio/perfect.mp3" preload="metadata"></audio>

<script>
/* ==========================================
   CONFIGURATION — customize here
   ========================================== */
const CONFIG = {
  monthsaryText: "Happy 5th Monthsary Baby",
  pin: "1111",
  songTitle: "Our Love Song",
  songSrc: "audio/perfect.mp3",
  songCover: "images/templates/my-love-song/memory1.jpg"
};

/* memory slideshow photos — add or remove freely */
const memories = [
  { image:"images/templates/my-love-song/memory1.jpg", caption:"Day one, still my favourite" },
  { image:"images/templates/my-love-song/memory2.jpg", caption:"That trip we almost cancelled" },
  { image:"images/templates/my-love-song/memory3.jpg", caption:"Just an ordinary Tuesday" }
];

document.getElementById('monthsaryTitle').textContent = CONFIG.monthsaryText;
document.getElementById('playerTitle').textContent = CONFIG.songTitle;
document.getElementById('playerCover').src = CONFIG.songCover;
document.getElementById('songAudio').src = CONFIG.songSrc;

/* ==========================================
   NAVIGATION
   ========================================== */
function showScene(id){
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.querySelectorAll('[data-back]').forEach(btn => {
  btn.addEventListener('click', () => showScene(btn.dataset.back));
});
document.querySelectorAll('.menu-card').forEach(card => {
  card.addEventListener('click', () => showScene(card.dataset.target));
});
document.getElementById('nextBtn').addEventListener('click', () => showScene('scene-pin'));

/* ==========================================
   AMBIENT FLOATING NOTES
   ========================================== */
const ambient = document.getElementById('ambient');
const noteSymbols = ['♪','♫','♬'];
for(let i=0;i<12;i++){
  const s = document.createElement('span');
  s.textContent = noteSymbols[Math.floor(Math.random()*noteSymbols.length)];
  s.style.left = Math.random()*100 + '%';
  s.style.fontSize = (12 + Math.random()*14) + 'px';
  s.style.setProperty('--drift', (Math.random()*60-30)+'px');
  s.style.animationDuration = (7 + Math.random()*8) + 's';
  s.style.animationDelay = (Math.random()*8) + 's';
  ambient.appendChild(s);
}

/* ==========================================
   PIN SYSTEM
   ========================================== */
let pinValue = '';
const pinDots = document.querySelectorAll('#pinDots span');
const pinDotsWrap = document.getElementById('pinDots');
const pinError = document.getElementById('pinError');

function renderPin(){ pinDots.forEach((dot,i) => dot.classList.toggle('filled', i < pinValue.length)); }

function checkPin(){
  if(pinValue === CONFIG.pin){
    pinError.textContent = '';
    setTimeout(() => { showScene('scene-menu'); pinValue=''; renderPin(); }, 250);
  } else {
    pinError.textContent = "That's not quite it, try again";
    pinDotsWrap.classList.add('error');
    setTimeout(() => { pinDotsWrap.classList.remove('error'); pinValue=''; renderPin(); }, 400);
  }
}
document.getElementById('numpad').addEventListener('click', (e) => {
  const key = e.target.closest('.num-key');
  if(!key) return;
  if(key.id === 'delKey'){ pinValue = pinValue.slice(0,-1); renderPin(); return; }
  if(pinValue.length >= 4) return;
  pinValue += key.dataset.num;
  renderPin();
  if(pinValue.length === 4) checkPin();
});

/* ==========================================
   MEMORIES SLIDESHOW
   ========================================== */
const slideshow = document.getElementById('slideshow');
const slideDotsWrap = document.getElementById('slideDots');
let currentSlide = 0;
let slideTimer = null;

memories.forEach((m, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (i === 0 ? ' active' : '');
  slide.innerHTML = `
    <img src="${m.image}" alt="" onerror="this.style.opacity=0">
    <div class="slide-caption">${m.caption}</div>`;
  slideshow.insertBefore(slide, document.getElementById('slidePrev'));

  const dot = document.createElement('span');
  if(i === 0) dot.classList.add('active');
  dot.addEventListener('click', () => goToSlide(i));
  slideDotsWrap.appendChild(dot);
});

function goToSlide(i){
  const slides = slideshow.querySelectorAll('.slide');
  const dots = slideDotsWrap.querySelectorAll('span');
  currentSlide = (i + slides.length) % slides.length;
  slides.forEach((s, idx) => s.classList.toggle('active', idx === currentSlide));
  dots.forEach((d, idx) => d.classList.toggle('active', idx === currentSlide));
  resetSlideTimer();
}
function resetSlideTimer(){
  clearInterval(slideTimer);
  slideTimer = setInterval(() => goToSlide(currentSlide + 1), 4000);
}
document.getElementById('slidePrev').addEventListener('click', () => goToSlide(currentSlide - 1));
document.getElementById('slideNext').addEventListener('click', () => goToSlide(currentSlide + 1));
resetSlideTimer();

/* ==========================================
   MUSIC PLAYER
   ========================================== */
const songAudio = document.getElementById('songAudio');
const playerPlay = document.getElementById('playerPlay');
const playerBar = document.getElementById('playerBar');
const playerBarFill = document.getElementById('playerBarFill');
const playerCurrent = document.getElementById('playerCurrent');
const playerRemaining = document.getElementById('playerRemaining');
const volBar = document.getElementById('volBar');
const volBarFill = document.getElementById('volBarFill');

function formatTime(sec){
  if(!isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

playerPlay.addEventListener('click', () => {
  if(songAudio.paused){
    songAudio.play().catch(() => {});
    playerPlay.textContent = '❚❚';
  } else {
    songAudio.pause();
    playerPlay.textContent = '▶';
  }
});

songAudio.addEventListener('timeupdate', () => {
  const pct = songAudio.duration ? (songAudio.currentTime / songAudio.duration) * 100 : 0;
  playerBarFill.style.width = pct + '%';
  playerCurrent.textContent = formatTime(songAudio.currentTime);
  playerRemaining.textContent = '-' + formatTime(songAudio.duration - songAudio.currentTime);
});
songAudio.addEventListener('ended', () => { playerPlay.textContent = '▶'; });

playerBar.addEventListener('click', (e) => {
  const rect = playerBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if(songAudio.duration) songAudio.currentTime = pct * songAudio.duration;
});

document.getElementById('playerBack').addEventListener('click', () => {
  songAudio.currentTime = Math.max(0, songAudio.currentTime - 10);
});
document.getElementById('playerFwd').addEventListener('click', () => {
  songAudio.currentTime = Math.min(songAudio.duration || 0, songAudio.currentTime + 10);
});

songAudio.volume = 0.7;
volBarFill.style.width = '70%';
volBar.addEventListener('click', (e) => {
  const rect = volBar.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  songAudio.volume = pct;
  volBarFill.style.width = (pct*100) + '%';
});
</script>
</body>
</html>
